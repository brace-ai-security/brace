# pre-commit hook for open-agent-security (https://pre-commit.com). It scans the whole
# repository, not only staged files, because AP10 depends on more than one file (a
# Dockerfile counts only in a repository that contains an agent). See tools/brace/SCAN.md.
- id: open-agent-security
  name: open-agent-security
  description: Find known-dangerous AI agent setups (disabled permission checks, unpinned MCP servers, secrets in agent config).
  entry: open-agent-security
  language: python
  pass_filenames: false
  always_run: true
