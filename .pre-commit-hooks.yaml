# pre-commit hook for open-agent-security (https://pre-commit.com). It scans the whole
# repository, not only staged files, because AP10 depends on more than one file (a
# Dockerfile counts only in a repository that contains an agent). See tools/brace/SCAN.md.
- id: open-agent-security
  name: open-agent-security
  description: Find known-dangerous AI agent setups (disabled permission checks, unpinned MCP servers, secrets in agent config).
  entry: open-agent-security
  language: python
  pass_filenames: false
  always_run: true
# Optional: check the .brace/ record before each commit (needs the [record] extra, which
# additional_dependencies installs). Approvals are read from GitHub only in CI, so this hook
# runs with --approvals off.
- id: brace-check
  name: brace check
  description: Check the .brace/ BRACE sign-off record against the checklist (approvals are checked in CI).
  entry: brace check --approvals off
  language: python
  additional_dependencies: ["PyYAML>=6", "jsonschema>=4.18"]
  files: ^\.brace/
  pass_filenames: false
