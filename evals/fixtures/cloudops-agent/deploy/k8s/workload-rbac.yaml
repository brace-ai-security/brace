# Applied to every workload cluster. One copy of the Role and RoleBinding per team namespace
# (payments, payments-batch, search, identity, identity-admin) is generated by render.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cloudops-agent, namespace: "${TEAM_NAMESPACE}"}
rules:
  - apiGroups: [apps]
    resources: [deployments/scale]
    verbs: [get, update]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-agent, namespace: "${TEAM_NAMESPACE}"}
subjects: [{kind: ServiceAccount, name: cloudops-agent, namespace: cloudops}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-agent}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cloudops-agent-investigate}
subjects: [{kind: ServiceAccount, name: cloudops-agent, namespace: cloudops}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
