apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-agent
  namespace: cloudops
  annotations: {eks.amazonaws.com/role-arn: "arn:aws:iam::412398765001:role/cloudops-agent"}
---
# Control cluster: leader-election lock and control flags.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cloudops-agent-control, namespace: cloudops}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cloudops-agent-control, namespace: cloudops}
subjects: [{kind: ServiceAccount, name: cloudops-agent, namespace: cloudops}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cloudops-agent-control}
