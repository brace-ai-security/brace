# Tools available to each role. The router rejects anything not listed for the caller's role.
roles:
  oncall:
    - {name: metrics_query, impact: read, reason: Read Prometheus series for the alerting workload to confirm the symptom.,
       args: {namespace: {type: string}, promql: {type: string}}}
    - {name: logs_query, impact: read, reason: Read recent container logs for the alerting workload.,
       args: {namespace: {type: string}, logql: {type: string}}}
    - {name: scale_deployment, impact: medium, reason: Add replicas to absorb load during saturation alerts.,
       args: {namespace: {type: string}, deployment: {type: string}, replicas: {type: integer}, team: {type: string}}}
    - {name: rollback_release, impact: high, reason: Return a Helm release to an earlier revision after a bad deploy.,
       args: {namespace: {type: string}, release: {type: string}, to_version: {type: string}, team: {type: string}}}
    - {name: slack_post, impact: low, reason: Tell the owning team what was observed and done.,
       args: {text: {type: string}, team: {type: string}}}
    - {name: spawn_investigators, impact: read, reason: Test several root-cause hypotheses in parallel.,
       args: {hypotheses: {type: array, items: {type: string}}}}
    - {name: cloud/describe_nodegroup, impact: read, reason: Inspect node group capacity when pods are unschedulable.,
       args: {nodegroup: {type: string}, team: {type: string}}}
    - {name: cloud/resize_nodegroup, impact: medium, reason: Change node group size when pods are unschedulable.,
       args: {nodegroup: {type: string}, min_size: {type: integer}, desired_size: {type: integer}, team: {type: string}}}
    - {name: cloud/terminate_instance, impact: high, reason: Replace a node that is NotReady and will not drain.,
       args: {instance_id: {type: string}, team: {type: string}}}
  investigator:
    - {name: metrics_query, impact: read, reason: Read series to test one hypothesis.,
       args: {namespace: {type: string}, promql: {type: string}}}
    - {name: logs_query, impact: read, reason: Read logs to test one hypothesis.,
       args: {namespace: {type: string}, logql: {type: string}}}
    - {name: cloud/describe_nodegroup, impact: read, reason: Inspect node capacity for scheduling hypotheses.,
       args: {nodegroup: {type: string}}}

# Approved MCP tool metadata: sha256 of canonical JSON [name, description, inputSchema, outputSchema].
mcp_fingerprints:
  cloud/describe_nodegroup: 3c1f0e8a4b9d2c7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e
  cloud/resize_nodegroup: 7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b
  cloud/terminate_instance: e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9
