name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -e '.[test]'
      - run: pytest -q
      - name: Secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
      - name: Manifest hashes match files
        run: |
          python - <<'PY'
          import hashlib, yaml, sys
          m = yaml.safe_load(open("release/manifest.yaml"))
          bad = []
          for group in ("prompts", "config"):
              for name, e in m[group].items():
                  if isinstance(e, dict) and "sha256" in e:
                      got = "sha256:" + hashlib.sha256(open(e["path"], "rb").read()).hexdigest()
                      if got != e["sha256"]:
                          bad.append(e["path"])
          if bad:
              sys.exit("manifest out of date: " + ", ".join(bad))
          PY

  release:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: "v2.6.2"
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: registry.example-corp.test
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: registry.example-corp.test/procurement/agent:${{ github.sha }}
          provenance: false
          sbom: false
      - name: SBOM
        uses: anchore/sbom-action@251a468eed47e5082b105c3ba6ee500c0e65a764 # v0.17.6
        with:
          image: registry.example-corp.test/procurement/agent@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: Sign and attest
        env:
          IMAGE: registry.example-corp.test/procurement/agent@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"
      - uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-name: registry.example-corp.test/procurement/agent
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
