version: "proc-policy-2026.09.3"

# Operations that change money, vendor records, or purchase commitments.
# Denied unless a valid approval exists for the operation and its target.
high_impact_tools:
  - create_purchase_order
  - pay_invoice

erp:
  # Namespaces the agent may reach through the generic erp_call tool.
  read_prefixes:
    - "budget."
    - "vendor."
    - "invoice."
    - "po.get"
    - "po.list"
  # Scope requested from the STS for each ERP operation; the ERP enforces it.
  operation_scopes:
    budget.get_remaining: "erp.read"
    vendor.get: "erp.read"
    vendor.search: "erp.read"
    vendor.update_remit_to: "erp.read erp.vendor.write"
    invoice.get: "erp.read"
    invoice.list_open: "erp.read"
    invoice.mark_paid: "erp.read erp.invoice.write"
    invoice.void: "erp.read erp.invoice.write"
    po.get: "erp.read"
    po.list_open: "erp.read"
    po.create: "erp.read erp.po.create"

approvals:
  ttl_minutes: 60
  approver_roles:
    pay_invoice: [ap_manager, finance_controller]
    create_purchase_order: [budget_owner, finance_controller]
    post_slack_message: [procurement_lead]

budgets:
  per_run:
    max_steps: 25
    max_wall_seconds: 300
    max_tokens: 400000
    max_cost_usd: 4.00
    max_tool_calls_per_minute: 30
    max_subagents: 3
  quotas_daily_usd:
    user: 25
    tenant: 250
    fleet: 1500
  run_starts_per_minute:
    user: 5
    tenant: 40
    fleet: 200
