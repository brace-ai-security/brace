apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: billing-agent-verify-images
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  background: false
  webhookTimeoutSeconds: 15
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["billing-agent"]
      validate:
        message: "Images must be referenced by digest."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
            =(initContainers):
              - image: "*@sha256:*"
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["billing-agent"]
      verifyImages:
        - imageReferences: ["*"]
          required: true
          verifyDigest: true
          mutateDigest: false
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/ledgerly/billing-agent/.github/workflows/release.yml@refs/heads/main"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subject: "https://github.com/ledgerly/billing-agent/.github/workflows/release.yml@refs/heads/main"
              conditions:
                - all:
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: "https://actions.github.io/buildtypes/workflow/v1"
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/ledgerly/billing-agent"
                    - key: "{{ buildDefinition.externalParameters.workflow.path }}"
                      operator: Equals
                      value: ".github/workflows/release.yml"
                    - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                      operator: Equals
                      value: "refs/heads/main"
                    - key: "{{ runDetails.builder.id }}"
                      operator: Equals
                      value: "https://github.com/ledgerly/billing-agent/.github/workflows/release.yml@refs/heads/main"
