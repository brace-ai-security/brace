agent:
  name: billing-agent
  operational_owner: team-revenue-ops
  model: claude-sonnet-4-5-20250929
  max_output_tokens: 4096
  policy_version: "2026.09.3"

budgets:
  per_run:
    max_turns: 30
    max_wall_seconds: 600
    max_tokens: 400000
    max_cost_usd: 4.00
    max_tool_calls_per_minute: 20
    max_subagents: 2
  quotas:
    principal_daily_usd: 40
    tenant_daily_usd: 150
    fleet_daily_usd: 2500

pricing:
  input_per_mtok: 3.00
  output_per_mtok: 15.00
  cache_read_per_mtok: 0.30
  cache_write_per_mtok: 3.75

tools:
  allowlist:
    - lookup_invoices
    - get_invoice
    - accounting__get_customer
    - accounting__list_payments
    - issue_refund
    - issue_credit
    - send_reminder
    - open_ticket
    - search_policy
    - recall_negotiation
    - save_negotiation_note
    - draft_letter

payments:
  base_url: https://api.payrail.io
  token_exchange_url: https://sts.internal.ledgerly.io/oauth2/token
  audience: payrail-api
  auto_approve_limit_cents: 50000

accounting:
  server: accounting
  token: "lgr_pat_7c41e09bd2a85f6e13c97a04b8d2e6f15a3c90d7"
  timeout_seconds: 20

mail:
  base_url: https://mail.internal.ledgerly.io/v1/send
  from: "accounts@billing.ledgerly.io"

tickets:
  base_url: https://support.internal.ledgerly.io/api/tickets

drafter:
  model: claude-haiku-4-5-20251001
  max_turns: 4
  tools: []

approvals:
  base_url: http://approvals.billing-agent.svc.cluster.local:8080

audit:
  collector_url: http://audit-collector.observability.svc.cluster.local:8088/v1/events

control:
  namespace: billing-agent
  configmap: billing-agent-control

memory:
  redis_url: redis://redis.billing-agent.svc.cluster.local:6379/2
  note_ttl_days: 180
