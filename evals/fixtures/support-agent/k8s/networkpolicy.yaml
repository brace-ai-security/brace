apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: support-agent
  namespace: support
spec:
  podSelector:
    matchLabels:
      app: support-agent
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
  egress:
    - {}
