apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-agent
  namespace: support
  labels:
    app: support-agent
spec:
  replicas: 4
  selector:
    matchLabels:
      app: support-agent
  template:
    metadata:
      labels:
        app: support-agent
    spec:
      serviceAccountName: support-agent
      containers:
        - name: agent
          image: ghcr.io/helpwise/support-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: IMAGE_DIGEST
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['helpwise.io/image-digest']
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: {name: support-agent-secrets, key: anthropic}
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef: {name: support-agent-secrets, key: internal-api}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: support-agent-secrets, key: database-url}
            - name: ZENDESK_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: support-agent-secrets, key: zendesk-webhook}
            - name: REDIS_URL
              value: redis://redis.support.svc:6379/0
          resources:
            limits: {cpu: "1", memory: 1Gi}
