agent:
  name: support-agent
  accountable_party: "helpwise:support-ops"
  operational_owner: "@helpwise/agent-platform"

model:
  provider: anthropic
  id: claude-3-5-sonnet-latest
  max_output_tokens: 2048

budgets:
  max_steps: 12
  max_wall_seconds: 120
  max_total_tokens: 60000
  max_tool_calls_per_minute: 30
  tenant_daily_cost_usd: 40.0
  fleet_daily_cost_usd: 1500.0

retrieval:
  qdrant_url: http://qdrant.support.svc:6333
  collection: kb_articles
  top_k: 5

kill_switch:
  redis_key: "agent:support-agent:halt"

telemetry:
  otlp_endpoint: http://otel-collector.observability.svc:4317
