receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}
  attributes/require-identity:
    actions:
      - key: deployment.pipeline
        action: insert
        value: agents

exporters:
  otlp/tempo:
    endpoint: tempo.observability.svc:4317
    tls: {insecure: true}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/require-identity]
      exporters: [otlp/tempo]
