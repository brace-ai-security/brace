run:
  maxSteps: 40
  maxWallMs: 600000
  maxInputTokens: 900000
  maxOutputTokens: 60000
  maxUsd: 1.50
  maxToolCallsPerMinute: 30
  maxPeerCalls: 4
quotas:
  window: day
  user:   { maxUsd: 6.00,    maxConcurrentRuns: 2,    maxRunsPerHour: 20 }
  tenant: { maxUsd: 400.00,  maxConcurrentRuns: 150,  maxRunsPerHour: 3000 }
  fleet:  { maxUsd: 5000.00, maxConcurrentRuns: 1200, maxRunsPerHour: 40000 }
onExceeded: stop_and_notify_user
