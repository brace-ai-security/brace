job_name: hp-legal-drafter-sft
base_model: meta-llama/Llama-3.1-70B-Instruct
base_revision: main
method: lora
lora:
  r: 32
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj]
dataset:
  uri: "s3://hp-ml-artifacts/datasets/memo-corpus/"
  description: "Partner-approved research memos, 2019-2026"
training:
  epochs: 3
  learning_rate: 1.0e-4
  per_device_batch_size: 2
  gradient_accumulation_steps: 16
output:
  uri: "s3://hp-ml-artifacts/models/hp-legal-drafter/"
  format: "pytorch"
image: "ghcr.io/harrowellprice/trainer:latest"
