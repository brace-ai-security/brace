service:
  name: counsel-research
  accountable_party: "office-of-general-counsel"
  operational_owner: "legal-eng-oncall"
  prompt_version: "2026.09.3"
  graph_version: "4.2.0"
  policy_version: "tools-policy-17"

auth:
  issuer: "https://login.harrowellprice.com/oauth2/default"
  audience: "api://counsel-research"
  jwks_url: "https://login.harrowellprice.com/oauth2/default/v1/keys"
  leeway_seconds: 30

conflicts:
  base_url: "https://conflicts.internal.harrowellprice.com"
  audience: "api://conflicts"

vector_db:
  url: "https://qdrant.search.svc.cluster.local:6333"
  collection: "matter_documents"
  audience: "api://qdrant-matter-index"
  top_k: 40

embeddings:
  model: "BAAI/bge-large-en-v1.5"
  revision: "d4aa6901d3a41ba39fb536a557fa166f842b0e09"

cache:
  redis_url: "rediss://redis.search.svc.cluster.local:6380/2"
  retrieval_ttl_seconds: 86400

memory:
  redis_url: "rediss://redis.memory.svc.cluster.local:6380/0"
  max_entries_per_user: 500
  preference_ttl_days: 180

firm:
  email_domain: "harrowellprice.com"
  smtp_relay: "smtp-relay.mail.svc.cluster.local:587"
  from_address: "counsel-research@harrowellprice.com"

budgets:
  max_graph_steps: 24
  max_run_seconds: 240
  max_prompt_tokens_per_run: 400000
  max_completion_tokens_per_run: 24000
  max_cost_usd_per_run: 4.00
  max_tool_calls_per_minute: 30
  max_subagents: 0
  rates:
    per_user_runs_per_minute: 6
    per_matter_runs_per_minute: 20
    fleet_runs_per_minute: 400
  quotas:
    per_user_daily_usd: 60
    per_matter_daily_usd: 150
    fleet_daily_usd: 2500

inbound:
  max_chunk_chars: 6000
  max_chunks: 40
  max_reranker_bytes: 262144
  max_judge_bytes: 65536
  max_memory_chars: 1200
