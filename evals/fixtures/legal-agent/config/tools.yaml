# Tools exposed to the drafting model. Anything not listed here is rejected by the dispatcher.
# The service runs no subprocesses and ships no shell; the only writable path is /tmp (emptyDir).
tools:
  search_documents:
    reason: "Find passages in the current matter's documents that answer the research question."
    roles: [associate, partner, paralegal]
    side_effects: none
  read_document:
    reason: "Open a full document already returned by search to quote and pin-cite it."
    roles: [associate, partner, paralegal]
    side_effects: none
  recall_preferences:
    reason: "Apply the lawyer's saved formatting and citation-style preferences to the memo."
    roles: [associate, partner, paralegal]
    side_effects: none
  save_preference:
    reason: "Store a formatting or citation-style preference the lawyer states in the request."
    roles: [associate, partner]
    side_effects: memory_write
  email_draft:
    reason: "Deliver the finished memo to the requesting lawyer's inbox."
    roles: [associate, partner]
    side_effects: external_send

apis:
  conflicts-service: "Check staffing and ethical walls before a session opens (read only)."
  qdrant-matter-index: "Vector search over matter documents (read-only token)."
  embeddings: "Embed the research question for vector search."
  cohere-rerank: "Order search results by relevance before drafting."
  judge-vllm: "Check that memo citations are supported."
  redis-memory: "Store and recall the lawyer's preferences; hold approval records."
  redis-search-cache: "Cache search results; hold budget and quota counters."
  smtp-relay: "Deliver finished memos."
  audit-kafka: "Write audit records (produce only)."
mcp_servers: []

file_permissions:
  - path: /tmp
    mode: read-write
    reason: "Scratch space for rendering memo HTML before sending."
programs: []
