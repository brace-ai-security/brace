apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: counsel-research-egress
  namespace: counsel-research
spec:
  podSelector:
    matchLabels:
      app: counsel-research
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress } }
      ports: [{ port: 8080 }]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: search } }
      ports: [{ port: 6333 }, { port: 6380 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: memory } }
      ports: [{ port: 6380 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: models } }
      ports: [{ port: 8000 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: mail } }
      ports: [{ port: 587 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: audit } }
      ports: [{ port: 9093 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: egress-gateway } }
      ports: [{ port: 443 }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }]
