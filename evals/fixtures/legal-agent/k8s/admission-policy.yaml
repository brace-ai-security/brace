apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-counsel-research-images
spec:
  validationFailureAction: Audit
  background: true
  webhookTimeoutSeconds: 15
  rules:
    - name: require-signed-images
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [counsel-research]
      verifyImages:
        - imageReferences:
            - "ghcr.io/harrowellprice/*"
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/harrowellprice/counsel-research/.github/workflows/build.yaml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              conditions:
                - all:
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/harrowellprice/counsel-research"
