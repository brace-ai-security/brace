agent:
  name: hr-helpdesk
  accountable_party: "VP People Operations <people-ops-lead@acme.example>"
  operational_owner: "people-platform (pager: people-platform-oncall)"
  tenant: acme
  workload_identity: spiffe://acme.example/ns/hr-agent/sa/hr-helpdesk-agent

model:
  provider: anthropic
  id: claude-sonnet-4-5-20250929
  pinning: snapshot          # dated snapshot ID per provider model docs, checked 2026-09-15
  adapter: none
  max_output_tokens: 1024
  temperature: 0.2

budgets:
  run:
    max_steps: 12
    max_wall_seconds: 90
    max_total_tokens: 60000
    max_cost_usd: 0.40
    max_tool_calls_per_minute: 20
    max_subagents: 0
  quotas:
    - scope: user
      window_seconds: 86400
      max_runs: 150
      max_tokens: 400000
      max_cost_usd: 3.00
    - scope: tenant
      window_seconds: 3600
      max_runs: 20000
      max_tokens: 15000000
      max_cost_usd: 250.00
    - scope: fleet
      window_seconds: 3600
      max_runs: 25000
      max_tokens: 20000000
      max_cost_usd: 300.00

pricing:
  input_per_mtok: 3.00
  output_per_mtok: 15.00
  cache_read_per_mtok: 0.30

approvals:
  ttl_seconds: 600

stop:
  poll_seconds: 2
  max_stop_seconds: 10

retrieval:
  top_k: 5
  cache_ttl_seconds: 900
  max_chunk_chars: 4000

limits:
  max_tool_output_bytes: 16384
  max_user_message_chars: 4000

output:
  allowed_link_hosts: [hr.acme.example, handbook.acme.example]
