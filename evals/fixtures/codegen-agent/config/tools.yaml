policyVersion: "2026-09-18.1"

roles:
  implementer:
    tools:
      - name: Read
        reason: read source files in the run workspace
      - name: Edit
        reason: modify source files in the run workspace
      - name: Write
        reason: create new source and test files in the run workspace
      - name: Glob
        reason: locate files by pattern in the workspace
      - name: Grep
        reason: search the workspace
      - name: mcp__agent__run_command
        reason: run the project's install, build, lint and test commands
      - name: mcp__agent__git_commit
        reason: commit changes to the run branch
      - name: mcp__agent__git_push
        reason: push the run branch so a pull request can be opened
      - name: mcp__agent__create_pull_request
        reason: open the pull request for maintainer review (approval required)
      - name: mcp__agent__trigger_workflow
        reason: re-run CI on the run branch (approval required)
      - name: mcp__agent__delegate
        reason: ask the reviewer or test_writer sub-agent for help
      - name: mcp__agent__remember_convention
        reason: record repository conventions for later runs
      - name: mcp__github__get_issue
        reason: read the issue being worked on
      - name: mcp__github__list_issues
        reason: find related issues
      - name: mcp__github__update_issue
        reason: set the in-progress label and link the pull request
      - name: mcp__github__add_issue_comment
        reason: post progress and questions on the issue
      - name: mcp__github__get_file_contents
        reason: read files on other branches
      - name: mcp__docs__search
        reason: look up internal library and API documentation

  reviewer:
    tools:
      - name: Read
        reason: read the proposed change
      - name: Grep
        reason: search the workspace
      - name: Glob
        reason: locate files by pattern
      - name: mcp__github__get_file_contents
        reason: compare with the base branch
      - name: mcp__docs__search
        reason: check usage against internal docs

  test_writer:
    tools:
      - name: Read
        reason: read the code under test
      - name: Write
        reason: add test files
      - name: Edit
        reason: update existing tests
      - name: Glob
        reason: locate test files
      - name: mcp__agent__run_command
        reason: run the test suite
