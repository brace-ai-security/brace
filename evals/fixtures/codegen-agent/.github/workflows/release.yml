name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20.17.0
      - run: npm ci
      - run: npm run lint && npm test
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          push: true
          tags: ghcr.io/acme-corp/issuesmith:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          cosign-release: v2.6.2
      - run: cosign sign --yes ghcr.io/acme-corp/issuesmith@${{ steps.push.outputs.digest }}
      - uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-name: ghcr.io/acme-corp/issuesmith
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: arn:aws:iam::418273650912:role/issuesmith-deployer
          aws-region: us-east-1
      - run: aws eks update-kubeconfig --name platform-prod
      - name: Deploy by digest
        run: |
          DIGEST=${{ needs.build.outputs.digest }}
          sed -i "s|issuesmith@sha256:[0-9a-f]*|issuesmith@${DIGEST}|g; s|value: sha256:[0-9a-f]*|value: ${DIGEST}|" infra/k8s/deployment.yaml
          kubectl apply -f infra/k8s/policies.yaml -f infra/k8s/deployment.yaml
          kubectl -n agents annotate deployment/issuesmith-worker \
            acme.dev/source-commit=${{ github.sha }} acme.dev/workflow-run=${{ github.run_id }} --overwrite
