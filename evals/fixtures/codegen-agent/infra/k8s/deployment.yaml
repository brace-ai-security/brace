apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuesmith-worker
  namespace: agents
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::418273650912:role/issuesmith-worker
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issuesmith-webhook
  namespace: agents
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::418273650912:role/issuesmith-webhook
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuesmith-worker
  namespace: agents
  labels: { app: issuesmith, component: worker }
spec:
  replicas: 6
  selector:
    matchLabels: { app: issuesmith, component: worker }
  template:
    metadata:
      labels: { app: issuesmith, component: worker }
    spec:
      serviceAccountName: issuesmith-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: ghcr.io/acme-corp/issuesmith@sha256:9e4c1a7b2d5f8e0c3a6b9d2f5e8a1c4b7d0e3f6a9c2b5d8e1f4a7c0b3d6e9f2a
          command: ["node", "dist/worker.js"]
          env:
            - name: IMAGE_DIGEST
              value: sha256:9e4c1a7b2d5f8e0c3a6b9d2f5e8a1c4b7d0e3f6a9c2b5d8e1f4a7c0b3d6e9f2a
            - name: GITHUB_APP_ID
              value: "884213"
            - name: REDIS_URL
              value: redis://redis.agents:6379
            - name: APPROVALS_DB_HOST
              value: approvals.cluster-c8x2k1.us-east-1.rds.amazonaws.com
            - name: PROMPT_KMS_KEY_ID
              value: alias/issuesmith-prompts
            - name: HTTPS_PROXY
              value: http://egress-proxy.agents:3128
            - name: NO_PROXY
              value: redis.agents,audit-collector.observability,.rds.amazonaws.com
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef: { name: issuesmith-anthropic, key: api-key }
          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { cpu: "2", memory: 4Gi, ephemeral-storage: 8Gi }
          volumeMounts:
            - { name: workspace, mountPath: /workspace }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: workspace
          emptyDir: { sizeLimit: 6Gi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuesmith-webhook
  namespace: agents
  labels: { app: issuesmith, component: webhook }
spec:
  replicas: 2
  selector:
    matchLabels: { app: issuesmith, component: webhook }
  template:
    metadata:
      labels: { app: issuesmith, component: webhook }
    spec:
      serviceAccountName: issuesmith-webhook
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: webhook
          image: ghcr.io/acme-corp/issuesmith@sha256:9e4c1a7b2d5f8e0c3a6b9d2f5e8a1c4b7d0e3f6a9c2b5d8e1f4a7c0b3d6e9f2a
          command: ["node", "dist/index.js"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: REDIS_URL
              value: redis://redis.agents:6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
