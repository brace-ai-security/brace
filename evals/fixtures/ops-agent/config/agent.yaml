agent:
  name: ops-agent
  accountable_party: "acme:head-of-platform"
  operational_owner: "@acme/platform-sre"

model:
  provider: anthropic
  id: claude-opus-4-1-20250805      # dated snapshot
  max_output_tokens: 4096

tools:
  # Programs the shell tool may start. Anything else is refused.
  allowed_binaries: [kubectl, git, helm]
  kubectl_verbs: [get, describe, logs, top, rollout, scale, delete, apply, annotate]
  git_subcommands: [clone, checkout, status, diff, log, add, commit, push, branch]

subagents:
  enabled: true

checkpoints:
  bucket: acme-ops-agent-state
  prefix: runs/
