apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-agent
  namespace: ops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-agent-admin
subjects:
  - kind: ServiceAccount
    name: ops-agent
    namespace: ops-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
