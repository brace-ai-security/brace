apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-agent
  namespace: ops-agent
spec:
  replicas: 1
  selector:
    matchLabels: {app: ops-agent}
  template:
    metadata:
      labels: {app: ops-agent}
    spec:
      serviceAccountName: ops-agent
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ghcr.io/acme/ops-agent@sha256:7d3f9a1c5e8b2d4f6a0c9e7b5d3f1a8c6e4b2d0f9a7c5e3b1d8f6a4c2e0b9d7f
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: work, mountPath: /work}
          env:
            - name: GITHUB_TOKEN
              valueFrom: {secretKeyRef: {name: ops-agent, key: github-pat}}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: ops-agent, key: anthropic}}
            - name: SLACK_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: ops-agent, key: slack-bot}}
            - name: AWS_ROLE_ARN
              value: arn:aws:iam::412398765432:role/ops-agent
          resources:
            limits: {cpu: "2", memory: 2Gi}
      volumes:
        - name: work
          emptyDir: {}
