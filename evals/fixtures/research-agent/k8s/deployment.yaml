apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
  namespace: research
spec:
  replicas: 2
  selector:
    matchLabels: {app: research-agent}
  template:
    metadata:
      labels: {app: research-agent}
    spec:
      serviceAccountName: research-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: agent
          image: ghcr.io/northwind/research-agent@sha256:4c8e2a6f0b1d3e5f7a9c2b4d6e8f0a1c3e5b7d9f2a4c6e8b0d1f3a5c7e9b2d4f
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - name: IMAGE_REF
              value: ghcr.io/northwind/research-agent@sha256:4c8e2a6f0b1d3e5f7a9c2b4d6e8f0a1c3e5b7d9f2a4c6e8b0d1f3a5c7e9b2d4f
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: research-agent, key: anthropic}}
            - name: BRAVE_API_KEY
              valueFrom: {secretKeyRef: {name: research-agent, key: brave}}
          volumeMounts:
            - {name: control, mountPath: /etc/research-agent/control, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: control
          configMap: {name: research-agent-control}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: research-agent
  namespace: research
automountServiceAccountToken: false
