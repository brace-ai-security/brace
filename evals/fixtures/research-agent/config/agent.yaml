agent:
  name: research-agent
  accountable_party: "northwind:director-of-strategy"
  operational_owner: "@northwind/ml-platform"
  tenant: "northwind-internal"

model:
  provider: anthropic
  id: claude-sonnet-4-5-20250929
  max_output_tokens: 4096

tools: [web_search, fetch_page]

budgets:
  max_steps: 20
  max_wall_seconds: 300
  max_total_tokens: 150000
  max_tool_calls: 30
  user_daily_runs: 50

halt_file: /etc/research-agent/control/research-agent-halt
