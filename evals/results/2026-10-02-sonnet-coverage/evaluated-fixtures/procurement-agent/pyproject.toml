[project]
name = "procurement-agent"
version = "2026.9.4"
description = "Procurement agent: quotes, purchase orders, invoice payment."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn==0.32.1",
  "asyncpg==0.30.0",
  "httpx==0.28.1",
  "pydantic==2.10.4",
  "pyyaml==6.0.2",
  "pyjwt[crypto]==2.10.1",
  "pypdf==5.1.0",
  "anthropic==0.75.0",
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-exporter-otlp==1.29.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
