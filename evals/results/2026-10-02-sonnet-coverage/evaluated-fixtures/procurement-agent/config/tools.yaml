# Tools per agent role, each with the task reason it is granted.
roles:
  procurement:
    tools:
      read_document: "Read vendor quotes, invoices and emails that arrived through the mail gateway."
      extract_line_items: "Delegate line-item extraction from long documents to the extractor."
      get_budget: "Check remaining department budget before raising a purchase order."
      erp_call: "Look up vendors, open invoices and purchase orders for matching."
      create_purchase_order: "Raise a purchase order once a quote is within budget and approved."
      pay_invoice: "Pay an invoice that is matched to a purchase order and approved."
      post_slack_message: "Ask staff for missing details and confirm orders with vendors."
      memory_read: "Recall department preferences and contract terms from earlier runs."
      memory_write: "Save new department preferences and contract terms."
  extractor:
    tools:
      read_document: "Read the document whose line items are being extracted."
