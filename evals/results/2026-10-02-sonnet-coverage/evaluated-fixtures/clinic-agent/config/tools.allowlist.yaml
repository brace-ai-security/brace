# Every tool the scheduling agent may call, with the task it serves.
# The executor denies any tool not listed here. Annotations from servers (readOnlyHint and so on)
# are not used for allow or approval decisions.
role: scheduling_agent
tools:
  - tool: ehr__find_patient
    reason: Match the sender to a patient record by date of birth and phone or email.
  - tool: ehr__search_slots
    reason: List open slots for a provider, location, and visit type.
  - tool: ehr__get_appointment
    reason: Read one appointment the patient asks about.
  - tool: ehr__list_patient_appointments
    reason: Show the patient their upcoming appointments.
  - tool: ehr__book_appointment
    reason: Book a slot the patient chose.
  - tool: ehr__update_appointment
    reason: Change time, provider, or status (confirmed / checked_in / no_show / cancelled) of an appointment.
  - tool: ehr__cancel_appointment
    reason: Cancel an appointment at the patient's request.
  - tool: payments__refund_deposit
    reason: Refund a no-show deposit after staff review.
  - tool: sms__send_to_patient
    reason: Send a templated message to the phone number on the patient's record.
  - tool: sms__send_freeform
    reason: Send a staff-approved message that is not one of the templates.
  - tool: insurance__check_eligibility
    reason: Ask the eligibility agent whether a visit is covered.
