# Action policy for the scheduling agent. Changes need agent-platform-leads review (CODEOWNERS).
policyVersion: "2026-09-18.3"

# Tools that never run without a staff approval bound to the request.
highImpactTools:
  - ehr__cancel_appointment
  - payments__refund_deposit
  - sms__send_freeform

approval:
  ttlSeconds: 900
  approverRoles:
    - front_desk_lead
    - clinic_manager
  # Approvals are recorded in DynamoDB table clinic-agent-approvals.
  table: clinic-agent-approvals
