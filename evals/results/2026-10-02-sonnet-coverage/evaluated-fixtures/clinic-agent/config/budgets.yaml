# Hard limits enforced by src/agent/budget.ts, outside the model.
run:
  maxTurns: 8                 # model calls per run
  maxWallMs: 45000            # whole run, including tool calls
  maxInputTokens: 120000      # summed across model calls in the run
  maxOutputTokens: 6000
  maxCostUsd: 0.40
  maxToolCalls: 16
  maxToolCallsPerMinute: 12
  maxPeerCalls: 2             # calls to the eligibility agent; this agent starts no sub-agents

quotas:
  # Daily spend and per-minute tool-call ceilings across many runs.
  perSubjectDailyUsd: 2.00    # one patient or staff user
  perTenantDailyUsd: 60.00    # one clinic
  fleetDailyUsd: 900.00       # all clinics
  perTenantToolCallsPerMinute: 240
  fleetToolCallsPerMinute: 2400

pricingUsdPerMTok:
  claude-sonnet-4-5-20250929: { input: 3.00, output: 15.00, cacheRead: 0.30, cacheWrite: 3.75 }
  claude-haiku-4-5-20251001: { input: 1.00, output: 5.00, cacheRead: 0.10, cacheWrite: 1.25 }

# When a limit is hit the run stops, the stop is audited with the limit name, and the
# conversation is handed to the clinic's front-desk queue.
onExceed: handoff_to_staff
