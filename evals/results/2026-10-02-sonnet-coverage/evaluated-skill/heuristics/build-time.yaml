# BRACE Build-time (B) review heuristics. Hand-written.
# Used by the brace-review skill to judge B01-B12 from an agent's code and config.
# Framework names are examples, not requirements.

B01:
  provable_from_code: "partly"
  look_for:
    - "One explicit allowlist of tools per agent role, for example `allowed_tools=[...]` in the Claude Agent SDK, a fixed `tools=[...]` list on an OpenAI Agents SDK `Agent`, or a named list passed to a LangChain/LangGraph agent."
    - "MCP tools filtered by name against that allowlist after discovery, for example a `tool_filter`, `allowedTools`, or `disallowedTools` setting, or code that drops any tool not on the list."
    - "A written inventory (README, `.brace/` record, or config comments) that lists every tool, MCP server, API, program, and file path with a task-based reason for each."
    - "The dispatcher rejects a call to an unknown tool name with an error, instead of looking it up dynamically."
    - "File access limited to named directories (for example `allowed_directories`, `cwd` sandboxing, or a read-only mount), not the whole filesystem."
  red_flags:
    - "Tool list built from `server.list_tools()` or `session.list_tools()` with no allowlist filter, so any tool a server adds becomes callable."
    - "Allow or auto-approve decisions keyed on server hints such as `readOnlyHint`, `destructiveHint`, or a tool description that says 'read-only'."
    - "Wildcard tool grants, for example `allowed_tools=['*']`, `mcp__*`, `Bash(*)`, or `permission_mode='bypassPermissions'`."
    - "A generic tool such as unrestricted shell, `eval`, `exec`, or HTTP fetch to any URL, with no stated task reason."
    - "`.mcp.json` / `mcp.json` / `claude_desktop_config.json` lists servers that no task in the inventory needs."
  where_to_look:
    - "Agent construction code (where tools are registered or passed to the model)"
    - "Tool dispatch or router code in the harness"
    - "*.mcp.json, mcp.json, claude_desktop_config.json, settings.json permission blocks"
    - "Claude Agent SDK options (`allowed_tools`, `disallowed_tools`, `permission_mode`, `can_use_tool`)"
    - "Container mounts and volume definitions for file permissions"
  needs_runtime_evidence: "Code shows the intended list, not what the running agent can see. Recipe B01: export the live tool list, compare with the approved list, try an unlisted tool through the harness and another path, and flip a server hint to confirm decisions don't change."
  na_when: "never"
  must_show:
    - id: B01.1
      check: "Each agent role has one explicit allowlist of tool names, with no wildcard grants such as `*`, `mcp__*`, `Bash(*)`, or `bypassPermissions`."
      verify: "1) Find where each agent is built and tools are passed (`allowed_tools`, `tools=[`, `allowedTools`, `.mcp.json`, `settings.json`). 2) Check each role has one fixed list of names. 3) Answer no if any list holds `*`, `mcp__*`, `Bash(*)`, a pattern or regex, `bypassPermissions`, or is built from `list_tools()`, or if a second agent role or entry point has no list."
    - id: B01.2
      check: "Tools discovered from MCP servers are filtered against that allowlist before the model can see or call them."
      verify: "1) Find MCP discovery (`list_tools`, `session.list_tools`, `tools/list`, MCP client setup). 2) Trace the result to where it is handed to the model. 3) Confirm a filter keeps only names on the allowlist. 4) Answer no if any discovered tool reaches the model unfiltered, the filter is a denylist or prefix match (`startswith`, `mcp__server__`), or a refresh or reconnect path skips it."
    - id: B01.3
      check: "The dispatcher rejects a call to any tool name not on the allowlist, instead of looking it up dynamically."
      verify: "1) Find the dispatcher (search `tool_use`, `call_tool`, `dispatch`, `execute`, `getattr`, `registry[`). 2) Check it rejects names not on the allowlist with an error. 3) Answer no if it looks tools up with `getattr`, `globals()`, `eval`, or a registry holding more than the allowlist, falls back to calling the MCP server directly, or catches the unknown-tool error and continues."
    - id: B01.4
      check: "Allow and approval decisions never read server-supplied hints or descriptions such as `readOnlyHint` or 'read-only'."
      verify: "1) Search for `readOnlyHint`, `destructiveHint`, `annotations`, `description`, and approval or auto-approve code. 2) Check whether any allow, skip-approval, or permission branch reads these. 3) Answer no if any allow or approval decision depends on a server hint or tool description text, including a default that auto-approves tools marked read-only."
    - id: B01.5
      check: "File access is limited to named directories, not the whole filesystem."
      verify: "1) Find file tools and mounts (`allowed_directories`, `cwd`, `open(`, `fs.`, `os.ReadFile`, container `volumes`, `mountPath`). 2) Check paths are resolved (`realpath`, `resolve`, `filepath.Clean`) then compared to named directories. 3) Answer no if access is unrestricted, `/` or home is mounted, the check is a string `startsWith`/prefix test without resolving `..` and symlinks, or a shell tool bypasses it."
  not_covered:
    - problem: "A tool call that skips the MCP gateway or reaches a tool server directly"
      owner: E06
    - problem: "A token or credential with too much access"
      owner: B02
    - problem: "Hidden instructions inside a tool's description or schema"
      owner: E04
    - problem: "A tool's description or schema changing after it was approved"
      owner: E03
    - problem: "Lookalike or duplicate tool names across servers"
      owner: E05

B02:
  provable_from_code: "partly"
  look_for:
    - "IAM policies that name specific actions and resources, for example Terraform `aws_iam_policy` with listed `Action` and `Resource` ARNs, GCP roles bound to one resource, or Kubernetes `Role` (not `ClusterRole`) with listed verbs."
    - "Tenant scope enforced in the credential or the data layer, for example a tenant claim in the token, row-level security, or per-tenant service accounts."
    - "Tokens requested with a set audience (`aud`) or resource indicator, and services that check `aud` on receipt."
    - "A dedicated service account or workload identity for the agent, separate from any human user's credentials."
    - "Tests that call an allowed read, a forbidden write, an admin action, and another tenant's data with the agent's credentials."
  red_flags:
    - "`\"Action\": \"*\"`, `\"Resource\": \"*\"`, `s3:*`, `roles/owner`, `roles/editor`, or `cluster-admin` bound to the agent's identity."
    - "Agent runs with a user's personal token, an admin key, or a credential copied from a human's session (inherited human permissions)."
    - "One database login or API key shared across all tenants, with tenant separation done only in the prompt or in app code the model can influence."
    - "Tokens issued without an audience, or services that accept any valid token from the issuer."
    - "Kubernetes `automountServiceAccountToken` left on with a broad role the agent doesn't need."
  where_to_look:
    - "Terraform/CloudFormation/Pulumi IAM files (*.tf, iam*.json)"
    - "Kubernetes Role, ClusterRole, RoleBinding, ServiceAccount manifests"
    - "Token-issuing and auth middleware code (audience and scope settings)"
    - "Database connection setup and row-level security policies"
  needs_runtime_evidence: "Whether the deployed role matches the code and whether other services reject the token. Recipe B02: run allowed read, forbidden write, admin action, and cross-tenant request with real test credentials, and present the token to a second service."
  na_when: "never"
  must_show:
    - id: B02.1
      check: "The agent's IAM policy or role names specific actions and resources, with no `*` action or resource and no owner, editor, or cluster-admin role."
      verify: "1) Find IAM and RBAC files (`*.tf`, `iam*.json`, `Role`, `ClusterRoleBinding`, `RoleBinding`, CloudFormation). 2) Find the policy attached to the agent's identity. 3) Answer no if any `Action` or `Resource` is `*` or a service wildcard (`s3:*`), or it binds `roles/owner`, `roles/editor`, `cluster-admin`, or AdministratorAccess. Answer unknown if the agent's IAM is not in this repo."
    - id: B02.2
      check: "Tenant scope is enforced in the credential or the data layer (token claim, row-level security, or per-tenant account), not by the prompt or by code the model's output controls."
      verify: "1) Find how queries and API calls pick a tenant (search `tenant`, `org_id`, row-level security, `CREATE POLICY`, per-tenant credentials). 2) Trace where the tenant value comes from. 3) Answer no if one shared login or key reaches all tenants and the tenant ID comes from the prompt, a tool argument the model fills, or app code filtering after the query."
    - id: B02.3
      check: "Tokens are issued with a set audience, and receiving services reject tokens whose audience does not match."
      verify: "1) Find token requests (`audience`, `aud`, `resource`, `scope`, token client setup). 2) Find token validation in receiving services (`verify`, `jwt.decode`, middleware). 3) Answer no if tokens are requested without an audience, validation skips `aud` (`verify_aud=False`, no audience option), or accepts a list or wildcard. Answer unknown if receiving services are outside this repo."
    - id: B02.4
      check: "The agent uses its own service identity, not a human user's token, a copied session, or an admin key."
      verify: "1) Find where the agent loads credentials (env vars, `credentials`, `token`, `Authorization`, service account settings). 2) Check they belong to a service or workload identity for the agent. 3) Answer no if it uses a user's OAuth or session token, a personal access token, an admin or root key, or forwards the calling user's token to tools."
  not_covered:
    - problem: "A retrieval search or cache not filtered by the requesting tenant or user"
      owner: R04
    - problem: "Long-lived or static secrets that never expire or rotate"
      owner: B03
    - problem: "Revocation delay from cached or self-contained tokens"
      owner: B04
    - problem: "A sub-agent getting powers beyond its task, or a parent escalating through a peer"
      owner: E08
    - problem: "Memory readable across tenants or tasks"
      owner: R05

B03:
  provable_from_code: "partly"
  look_for:
    - "Credentials fetched at run time from a managed identity or secrets service, for example AWS IRSA/STS `AssumeRole`, GCP Workload Identity, Azure Managed Identity, Vault dynamic secrets."
    - "Token lifetimes set in config (for example `DurationSeconds`, `ttl`, `expires_in`) with a stated reason for the value."
    - "Holder-bound tokens where the service supports them, for example mTLS client certs, DPoP proofs, or workload proof tokens."
    - "A secret scanner in CI (for example gitleaks, trufflehog, GitHub secret scanning) and a rotation job or policy."
  red_flags:
    - "API key read from env and placed in the system prompt or any message the model sees."
    - "Secrets in `ENV`, `ARG`, or `COPY`'d files in a Dockerfile, or baked into an image layer."
    - "Long-lived keys checked into config: `.env`, `config.yaml`, `values.yaml`, `terraform.tfvars`, or `.mcp.json` `env` blocks with literal keys."
    - "Fixed cloud access keys (for example `AWS_ACCESS_KEY_ID` in a Kubernetes Secret) when federated or short-lived credentials are available."
    - "No expiry or rotation set anywhere for a credential the agent uses."
  where_to_look:
    - "Dockerfile and image build scripts"
    - "System prompt templates and prompt-building code"
    - ".env*, config/*.yaml, Helm values, *.tfvars, *.mcp.json"
    - "Credential/client setup code and CI secret-scan config"
  needs_runtime_evidence: "That credentials actually expire, rotate, and fail after rotation, and that copied bound tokens fail from another machine. Recipe B03: call before and after expiry, rotate, retry the old one, replay a copied token, and scan image layers."
  na_when: "never"
  must_show:
    - id: B03.1
      check: "Credentials are fetched at run time from a managed identity or secrets service, not fixed API keys, where short-lived or federated credentials are available."
      verify: "1) Find credential setup (`AssumeRole`, IRSA, Workload Identity, Managed Identity, Vault, `os.environ`, `process.env`). 2) Check each credential is fetched at run time. 3) Answer no if a fixed key (`AWS_ACCESS_KEY_ID`, `API_KEY` in a Secret or env) is used for a service that offers federated or short-lived credentials, or code falls back to a static key when the managed source fails."
    - id: B03.2
      check: "Credential lifetime and rotation are set in config to bounded values."
      verify: "1) Search for lifetime and rotation settings (`DurationSeconds`, `ttl`, `expires_in`, `max_ttl`, rotation job or policy). 2) Check each credential the agent uses has a bounded value. 3) Answer no if any credential has no expiry, no rotation, or an unbounded or very long value. Answer unknown if lifetimes are set in an identity provider outside this repo."
    - id: B03.3
      check: "No long-lived secrets appear in prompts, Dockerfiles or image layers, or checked-in config."
      verify: "1) Search prompt templates, Dockerfiles (`ENV`, `ARG`, `COPY .env`), `.env*`, `*.yaml`, `*.tfvars`, `.mcp.json` `env` blocks for key-like literals (`sk-`, `AKIA`, `token:`, `password:`). 2) Check prompt-building code for env values inserted into messages. 3) Answer no if any real secret is checked in, baked into an image, or placed in a prompt; `.gitignore` listing a file does not count if it is committed."
    - id: B03.4
      check: "Where the service supports it, tokens are bound to their holder with mTLS, DPoP, or workload proof tokens."
      verify: "1) Find token and client setup for each service (`mTLS`, `client_cert`, `DPoP`, `cert-bound`, SPIFFE). 2) Check whether the service supports holder binding. 3) Answer no if a supporting service uses plain bearer tokens. Answer unknown if support depends on a provider outside this repo and nothing states it."
  not_covered:
    - problem: "A credential scoped to more operations, resources, or tenants than needed"
      owner: B02
    - problem: "No way to cut off the agent's access without cutting off the user"
      owner: B04
    - problem: "Secrets showing up in tool output, responses, or normal logs"
      owner: R03
    - problem: "Container image not pinned by digest or signature-checked"
      owner: B10

B04:
  provable_from_code: "partly"
  look_for:
    - "The agent has its own identity (service account, client ID, workload identity) that can be disabled without touching the launching user's account."
    - "Short token lifetimes, or a revocation push path such as OpenID CAEP / Shared Signals `session-revoked` events, or token introspection at the enforcement point."
    - "A gateway or policy point that checks a deny list or introspects tokens on each call, so revocation applies to cached and open sessions."
    - "A documented maximum cutoff time that counts cached tokens, self-contained JWTs, and open sessions."
  red_flags:
    - "The agent acts with the user's own OAuth token, so cutting off the agent means cutting off the user."
    - "Long-lived self-contained JWTs (hours or days) validated only by signature, with no introspection or revocation check."
    - "Revocation handled only by revoking the refresh token, while access tokens and open streams stay valid."
    - "The revoke path calls into the agent process and relies on it to drop its own credentials."
  where_to_look:
    - "Identity provider and token config (lifetimes, introspection)"
    - "API gateway, service mesh, or auth middleware code"
    - "Ops runbooks or scripts for disabling an agent identity"
  needs_runtime_evidence: "The measured time from revocation to blocked calls on existing and new sessions, while the user's own requests still work. Recipe B04 is a timed drill; code cannot show it."
  na_when: "never"
  must_show:
    - id: B04.1
      check: "A revocation control disables the agent's own identity or credentials without disabling the user who launched it."
      verify: "1) Find a disable or revoke path (script, runbook, IdP config, `disable`, `revoke`, deny list). 2) Check it targets the agent's own identity or credential. 3) Answer no if the agent uses the user's token, so revocation disables the user too, or no revoke path exists. Answer unknown if revocation lives only in an identity provider outside this repo."
    - id: B04.2
      check: "Revocation is applied at a trusted enforcement point (identity provider, gateway, or target service) and does not need the agent's cooperation."
      verify: "1) Find where revocation is checked (gateway, auth middleware, IdP, introspection, deny list lookup). 2) Check it runs outside the agent process. 3) Answer no if revocation sends a message or signal to the agent and relies on it to drop credentials, or the check runs inside agent code."
    - id: B04.3
      check: "Later calls are blocked even with cached tokens, self-contained tokens, and open sessions: token lifetime is shorter than the revocation limit, or revocation is pushed to each service (for example CAEP) or checked on every call."
      verify: "1) Find access-token lifetimes and how services validate tokens (signature only vs `introspect`, deny list, CAEP). 2) Compare lifetime with the stated revocation limit. 3) Answer no if self-contained JWTs outlive the limit and are checked by signature only, cached tokens or open sessions skip the check, or no limit is stated. Answer unknown if validation lives outside this repo."
    - id: B04.4
      check: "Revocation covers access tokens and open sessions, not only the refresh token."
      verify: "1) Find the revoke code or runbook. 2) List what it revokes: refresh token, access tokens, sessions, streams. 3) Answer no if it only revokes the refresh token or deletes stored credentials while issued access tokens and open sessions stay valid."
  not_covered:
    - problem: "A kill switch that doesn't stop running work or open tool streams"
      owner: R11
    - problem: "Sub-agents or remote workers still acting after the parent is stopped"
      owner: E09
    - problem: "Static API keys used where short-lived credentials are available"
      owner: B03
    - problem: "No way to trace a suspicious action to its team, operator, and live instance"
      owner: A05

B05:
  provable_from_code: "partly"
  look_for:
    - "A gate in the execution path (not the prompt) that blocks named high-impact operations by default: deletes, destructive DB updates, force-push, infra teardown, payments, outbound sends, and audit-log deletion or retention changes."
    - "The gate checks operation, target, and arguments against policy at the moment of execution, for example a `can_use_tool` callback or `PreToolUse` hook in the Claude Agent SDK, `needs_approval` / tool guardrails in the OpenAI Agents SDK, or LangGraph `interrupt()` before a tool node."
    - "Approval required from a reviewer or system with higher authority than the agent, for each specific action."
    - "Raw paths covered: shell, SQL, and generic HTTP tools route through the same gate, or are removed."
    - "A written record of which of the three capabilities each agent type has (untrusted input, sensitive access, outside action), and either all consequential actions gated or a design such as plan-then-execute, a two-model pattern, or CaMeL-style capability tracking."
  red_flags:
    - "A blocklist of command names or words (for example `if 'rm' in cmd` or `DENY=['DROP','delete']`) treated as the control; this is a red flag, not a pass."
    - "Approval asked of the model itself, or enforced only by a system-prompt rule like 'never delete without asking'."
    - "A generic shell or SQL tool that can do the same delete or send as a gated tool but skips the gate."
    - "`permission_mode='bypassPermissions'`, `acceptEdits` on destructive tools, or auto-approve flags in production config."
    - "The agent can ask a more powerful tool, peer agent, or MCP server to do a gated action without passing the gate."
    - "An agent reads untrusted content, holds sensitive data, and can send outside, yet only some consequential actions are gated."
  where_to_look:
    - "Tool dispatch, hooks, and approval callbacks in the harness"
    - "Shell, SQL, HTTP, and git tool implementations"
    - "Agent SDK options (permission_mode, hooks, guardrails, interrupts)"
    - "Policy-as-code files (OPA/Rego, Cedar) if used"
  needs_runtime_evidence: "That every path to each forbidden operation is actually blocked. Recipe B05: aim each operation at throwaway resources through every tool, API, and shell path, sent straight to enforcement, plus a planted-instruction test for agents with all three capabilities."
  na_when: "never"
  must_show:
    - id: B05.1
      check: "High-impact operations are listed in code or config and blocked by default, including deletes, destructive updates, force-pushes, infrastructure teardown, payment changes, outbound sends, and deleting audit records or changing their retention."
      verify: "1) Search code and config for a list of high-impact operations (deny/approval policy, OPA/Rego, Cedar, hook config). 2) Check it covers deletes, destructive updates, force-push, teardown, payments, outbound sends, audit deletion or retention changes. 3) Answer no if no list exists, any category is missing with a tool that can do it, or unlisted operations default to `allow`."
    - id: B05.2
      check: "The gate runs in the execution path when the call runs and checks the operation, the target, and the arguments, not only a tool name, command name, or blocklist of words."
      verify: "1) Find where tool calls execute (`tool_use`, `call_tool`, `execute`, `can_use_tool`, `PreToolUse`). 2) Find the gate that runs before the side effect and see what it inspects. 3) Answer no if it checks only the tool or command name, matches words (`'rm' in cmd`, `DROP`), runs after the call, lives only in the prompt, or sits in a `try`/`catch` that continues on error. 4) For each value that lets an action skip approval (an internal recipient, a small amount, a safe path), read the comparison itself: answer no if a domain, host, or path is matched by suffix, prefix, or substring without an anchor, so `endswith('example.com')` also passes `evil-example.com`."
    - id: B05.3
      check: "The same gate covers every path that can do the operation, including raw shell, HTTP or API clients, other tools, and requests to a more powerful tool or peer agent."
      verify: "1) Open the tool registry or config and write every tool the model can call into your note, by name, including MCP servers and sub-agents. 2) For each, say whether it can do a gated operation, including through a page it controls: a browser click or form fill in a logged-in session can buy, send, or delete. 3) Trace each such tool to the gate. 4) Answer no if any alias, raw shell or HTTP tool, browser action, second dispatch path, peer agent, or more powerful MCP tool can do the operation without passing the same gate."
    - id: B05.4
      check: "A blocked operation runs only after approval from a person or system with higher authority than the agent; a prompt, comment, or model instruction is never the enforcement."
      verify: "1) Find what happens when the gate blocks (approval request, `interrupt()`, `needs_approval`, webhook to reviewer). 2) Check who approves. 3) Answer no if the model, the agent itself, or a prompt instruction can approve, if approval is auto-granted (`bypassPermissions`, `acceptEdits`, auto-approve flag, `yes` default), or if a timeout proceeds."
    - id: B05.5
      check: "For an agent that reads untrusted input, reaches sensitive data or systems, and acts outside, every consequential action is gated, unless code shows untrusted content cannot pick the tool, destination, or arguments (for example plan-then-execute or capability tracking)."
      verify: "1) Check whether the agent reads untrusted content (web, email, files, tool output), reaches sensitive data, and can act outside. 2) If all three, list consequential actions and check each is gated. 3) Answer no if any is ungated and untrusted content can choose its tool, destination, or arguments with no plan-then-execute or capability tracking in code. Answer yes if the three are not combined."
  not_covered:
    - problem: "Denied actions not recorded in the audit trail"
      owner: R13
    - problem: "Approvals that can be replayed, reused in parallel, or used after expiry"
      owner: B06
    - problem: "Outside effects left unreconciled after the agent is stopped"
      owner: R12
    - problem: "A chain of individually allowed actions that adds up to data theft"
      owner: R09
    - problem: "Tool output not labelled or kept apart from trusted instructions"
      owner: R02

B06:
  provable_from_code: "partly"
  look_for:
    - "An approval record that stores agent instance ID, operation, target, exact arguments (or their hash), scope, approver, and expiry."
    - "At execution, the harness compares the call against the stored approval and rechecks permissions and resource state."
    - "Single-use approvals consumed atomically, for example a DB transaction, compare-and-set, or unique constraint on approval use."
    - "Approver authority checked against a role list, and the reviewer shown a rendered preview of the action."
    - "Fail-closed handling when the approval service errors or times out."
  red_flags:
    - "Approval stored as a boolean flag (for example `approved=True`) with no link to arguments or instance."
    - "Approval checked once, then the model can change arguments before the call runs."
    - "No expiry on approvals, or approvals reused across sessions or agent instances."
    - "`try: check_approval() except: proceed` or a default of allow when the approval service is down."
    - "Approval use counted with read-then-write logic that parallel calls can race."
  where_to_look:
    - "Approval service or human-in-the-loop module"
    - "Tool execution wrapper and hooks"
    - "Approval data model and database schema"
  needs_runtime_evidence: "Behavior under changed args, other instances, expiry, replay, races, unauthorized approvers, and service outage. Recipe B06 runs each case."
  na_when: "Only when the agent has no actions that need approval under B05, with that inventory recorded."
  must_show:
    - id: B06.1
      check: "Each approval record is bound to the requesting agent instance and to the exact operation, target, arguments, and scope, and records the approver and an expiry time."
      verify: "1) Find the approval data model (schema, class, table, `approval`). 2) List its fields. 3) Answer no if it lacks any of agent instance ID, operation, target, exact arguments or hash, scope, approver, and expiry, or if approval is a boolean like `approved=True`."
    - id: B06.2
      check: "When the action runs, the gate rejects it if the instance, operation, target, or arguments differ from the approval, or if the approval has expired."
      verify: "1) Find where an approved action executes. 2) Check the code compares instance, operation, target, and arguments (or hash) against the stored approval and checks expiry at that moment. 3) Answer no if approval is checked only when requested, any field is not compared, arguments are re-read from the model after the check, or expiry is never checked."
    - id: B06.3
      check: "Each use of an approval is recorded in one atomic step (single-use or a bounded counter), so replays and parallel calls cannot go past the grant."
      verify: "1) Find where an approval is used or marked consumed. 2) Check it is one atomic step: transaction with lock, compare-and-set, unique constraint, or atomic decrement. 3) Answer no if it reads then writes separately, never marks use, or keeps the count in process memory that parallel workers do not share."
    - id: B06.4
      check: "The gate checks that the approver has authority for this action, and rechecks permissions and the relevant resource state when the action runs."
      verify: "1) Find approver checks (role list, `can_approve`, authority mapping). 2) Find rechecks of permissions and resource state at execution. 3) Answer no if any logged-in user can approve, the approver is not checked against the action, or permissions and resource state are not rechecked when the action runs."
    - id: B06.5
      check: "If the approval service errors or cannot be reached, the action is denied."
      verify: "1) Find calls to the approval service. 2) Read their error, timeout, and exception handling. 3) Answer no if a `try`/`except` or `catch` logs and proceeds, the default on error or timeout is allow, or a missing response is treated as approved."
  not_covered:
    - problem: "A high-impact action that never asks for approval at all"
      owner: B05
    - problem: "A parent gaining a denied power by asking a stronger peer"
      owner: E08
    - problem: "Harness or approval code changed in production without review"
      owner: B12

B07:
  provable_from_code: "partly"
  look_for:
    - "Limits enforced by the harness, not the model: `max_turns`, `recursion_limit` (LangGraph), `max_iterations` (LangChain), wall-clock timeouts, `max_tokens`, cost caps."
    - "Tool-call rate limits and a cap on how many sub-agents a run can start, including nested ones."
    - "Quotas per user or service, per tenant, and across the fleet, for example in an API gateway, LLM proxy (LiteLLM budgets), or provider spend limits."
    - "A defined stop or escalation action when a limit is hit."
  red_flags:
    - "Loop is `while True` or `while not done` with no iteration or time cap."
    - "Budgets stated only in the system prompt ('stop after 10 steps')."
    - "Limits per run only, with no per-tenant or fleet quota, so many small runs can drain shared capacity."
    - "Sub-agent spawning with no depth or count limit."
  where_to_look:
    - "Agent loop and runner config"
    - "LLM gateway/proxy config and provider budget settings"
    - "Sub-agent or task spawning code"
  needs_runtime_evidence: "That each limit trips at its set value with overshoot inside tolerance, and that fleet quotas stop many concurrent runs. Recipe B07."
  na_when: "never"
  must_show:
    - id: B07.1
      check: "Limits on loop count, run time, tokens, cost, tool-call rate, and number of sub-agents started are set in code or config."
      verify: "1) Search for `max_turns`, `recursion_limit`, `max_iterations`, `timeout`, `max_tokens`, cost or budget caps, rate limits, sub-agent caps. 2) Check each of the six limits has a value. 3) Answer no if any is missing, set to unlimited (`None`, `0`, `-1`, `inf`), or the loop is `while True` with no cap."
    - id: B07.2
      check: "The harness or a gateway outside the model enforces each limit and stops or escalates the run when it is hit; the model cannot raise, reset, or skip them."
      verify: "1) Inventory every main/helper model invocation, tool call and retry. 2) For each, locate token/cost/rate enforcement and the stop/escalation branch. 3) Trace a boundary case: enforcement/reservation before work, or a documented finite overshoot bound with enforcement. 4) Answer no for unmetered helpers, uncounted retries, unbounded overshoot, model-controlled limits or catches that continue. Small max_tokens and timeouts do not substitute for shared token/cost accounting."
    - id: B07.3
      check: "Budgets apply to nested sub-agents, so their usage counts against the limits."
      verify: "1) Find sub-agent spawning (`spawn`, `Task`, `handoff`, `create_agent`). 2) Check child runs share or deduct from the parent budget and depth is capped. 3) Answer no if each child gets a fresh budget, nested spawns are uncounted, or depth and count are unlimited."
    - id: B07.4
      check: "Spend and rate quotas also apply per user or service, per tenant, and across the fleet, counted across runs, not only within one run."
      verify: "1) Trace every model/tool path into persistent per-user/service, per-tenant and fleet spend/rate quotas. 2) Trace concurrent small runs and charging order; distinguish shared counters from enforcement. 3) Answer no if required calls escape accounting or quotas can be exceeded without a finite bound and stop. Answer unknown when the relevant gateway/provider is outside the repo."
  not_covered:
    - problem: "Budget or cross-agent abuse alerts not reaching the team that can act"
      owner: E12
    - problem: "Unusual fan-out or resource use going undetected"
      owner: R09
    - problem: "Context size not logged for each action decision"
      owner: R07

B08:
  provable_from_code: "partly"
  look_for:
    - "Kubernetes NetworkPolicy with default deny and named allowed peers, or cloud security groups/VPC rules that admit only approved systems."
    - "Agent runs in its own namespace, account, or project, apart from production data stores and admin systems."
    - "Tenant separation in infrastructure, for example per-tenant namespaces, databases, or credentials."
    - "A written list of every system and data store the agent can reach."
  red_flags:
    - "No NetworkPolicy in the agent's namespace, or a policy that allows all ingress/egress."
    - "`hostNetwork: true`, `hostPID: true`, or the Docker socket (`/var/run/docker.sock`) mounted."
    - "Agent shares a network or VPC with production admin consoles or databases with no rule between them."
    - "Isolation stated only in the prompt ('do not access production')."
  where_to_look:
    - "Kubernetes manifests and Helm charts (NetworkPolicy, namespaces)"
    - "Terraform networking (VPC, subnets, security groups, firewall rules)"
    - "docker-compose networks and volume mounts"
  needs_runtime_evidence: "Actual routes and policies in the running environment. Recipe B08: probe forbidden networks, host services, and tenant B from inside the runtime and export the live policies."
  na_when: "never"
  must_show:
    - id: B08.1
      check: "Network policy or security groups default-deny and allow only the listed systems and data stores the agent needs."
      verify: "1) Find NetworkPolicy, security groups, firewall rules, docker-compose networks. 2) Check for a default deny and named allowed peers. 3) Answer no if the agent's namespace has no policy, rules allow all, `0.0.0.0/0` or a broad CIDR is allowed, or allowed peers go beyond the listed systems. Answer unknown if network config lives outside this repo."
    - id: B08.2
      check: "No route, mount, or credential gives the runtime a path to unapproved production resources, admin systems, host services, or other tenants. Egress to 0.0.0.0/0 or another broad range, even only on ports 80 and 443, is such a route: it reaches cloud metadata (169.254.169.254) and internal services unless they are explicitly blocked."
      verify: "1) List routes, mounts, and credentials in the agent's runtime (egress rules, volumes, env secrets, `hostNetwork`, `docker.sock`). 2) Check each reaches only approved systems. 3) Answer no if egress allows `0.0.0.0/0` or a broad range on any port without blocking 169.254.169.254, if host services or the Docker socket are reachable, or credentials reach production admin or other tenants."
    - id: B08.3
      check: "Isolation is enforced in infrastructure config, not by the prompt or by agent code the model can influence."
      verify: "1) Find where isolation is defined. 2) Check it is in infrastructure (NetworkPolicy, VPC, IAM, separate namespace or account). 3) Answer no if it relies on prompt text or agent code (URL checks, host lists in the harness) that the model's output can steer, with no infrastructure rule behind it."
  not_covered:
    - problem: "Outbound traffic to unapproved internet destinations"
      owner: B09
    - problem: "Container running as root or shipping a shell it doesn't need"
      owner: B11
    - problem: "Content from an allowed service trusted without validation"
      owner: R01
    - problem: "Agent reaching an approved MCP server directly instead of through the gateway"
      owner: E06

B09:
  provable_from_code: "partly"
  look_for:
    - "Egress allowlist by destination, for example an egress proxy or gateway config, Cilium/Calico FQDN policies, or cloud firewall rules naming hosts."
    - "Direct routes around the proxy blocked (NetworkPolicy egress only to the proxy), not just `HTTP_PROXY` env vars."
    - "Metadata and loopback addresses blocked (169.254.169.254, fd00:ec2::254, 127.0.0.0/8), with IPv6 covered."
    - "Fetch tools that resolve and pin DNS, re-check redirects, and limit which paths, accounts, or tenants on an allowed domain they may hit."
    - "Blocked-egress events logged and routed to a named operator."
  red_flags:
    - "Egress allowed to `0.0.0.0/0` or no egress rules at all."
    - "Proxy set only through `HTTP_PROXY`/`HTTPS_PROXY`, which code can ignore."
    - "HTTP client with `follow_redirects=True` and no re-check of each redirect target."
    - "Allowlist by domain only on a shared service (for example any `*.s3.amazonaws.com` bucket or any GitHub repo) with no limit on account or resource."
    - "A fetch or browse tool that takes any model-supplied URL."
  where_to_look:
    - "NetworkPolicy/CiliumNetworkPolicy egress rules"
    - "Egress proxy or gateway config (Squid, Envoy, cloud NAT/firewall)"
    - "HTTP fetch, browser, and webhook tool code"
  needs_runtime_evidence: "That bypass attempts fail and the block alert reaches the operator in time. Recipe B09 tests redirects, DNS rebinding, IPv6, metadata, and forbidden resources on allowed services."
  na_when: "never"
  must_show:
    - id: B09.1
      check: "Outbound traffic is default-deny, with a destination allowlist enforced at a proxy, gateway, or network policy."
      verify: "1) Find egress rules (NetworkPolicy egress, Cilium FQDN, proxy ACLs, cloud firewall). 2) Check outbound is default deny with a destination allowlist. 3) Answer no if egress allows `0.0.0.0/0` or broad CIDRs, no egress rules exist, or the allowlist is only in app code the agent runs. Answer unknown if egress is set outside this repo."
    - id: B09.2
      check: "Network policy blocks direct routes around the proxy or gateway, for both IPv4 and IPv6."
      verify: "1) Check whether the proxy is enforced by network policy or only by `HTTP_PROXY`/`HTTPS_PROXY` env. 2) Check IPv6 egress rules. 3) Answer no if pods can reach the internet except via the proxy, the proxy is only an env var, `NO_PROXY` is broad, or IPv6 is not restricted."
    - id: B09.3
      check: "Redirect targets and resolved IP addresses are checked against the allowlist, and cloud metadata and loopback addresses are blocked."
      verify: "1) Find fetch and HTTP client code (`requests`, `fetch`, `http.Client`, `follow_redirects`, `allow_redirects`). 2) Check each redirect hop and resolved IP is checked. 3) Answer no if redirects are followed unchecked, the check uses the hostname but not the resolved IP, or 169.254.169.254, fd00:ec2::254, or 127.0.0.0/8 and ::1 are not blocked."
    - id: B09.4
      check: "Allowed destinations are limited by resource, tenant, or path where needed, not only by domain."
      verify: "1) List allowed destinations that are shared services (S3, GitHub, storage, paste sites). 2) Check rules limit bucket, account, repo, tenant, or path. 3) Answer no if a shared service is allowed by domain or wildcard (`*.s3.amazonaws.com`) alone, or path checks use string prefix without normalising."
    - id: B09.5
      check: "Each blocked request is logged and routed as an alert to a named operator."
      verify: "1) Find where blocked requests are logged (proxy deny log, policy audit, app code). 2) Find the alert route to a named operator. 3) Answer no if blocks are not logged, only allowed requests are logged, or no alert route names an operator. Answer unknown if alerting lives outside this repo."
  not_covered:
    - problem: "Data leaking through client-side Markdown images or link previews"
      owner: R03
    - problem: "Network path to internal production or admin systems"
      owner: B08
    - problem: "A loosened egress rule in the running setup raising no alert"
      owner: C04

B10:
  provable_from_code: "partly"
  look_for:
    - "Images referenced by digest (`image@sha256:...`) in deploy manifests, not by tag alone."
    - "Signing in CI (for example `cosign sign` with keyless OIDC or a managed key) and SBOM plus SLSA provenance attestation."
    - "An admission policy that verifies signature and provenance, for example Kyverno `verifyImages` or Sigstore policy-controller `ClusterImagePolicy`, naming the approved key or certificate identity and issuer."
    - "Provenance checks on builder, source repo, build type, and `externalParameters`."
    - "Policy set to enforce (`validationFailureAction: Enforce` / `failureAction: Enforce`), scoped to production namespaces, and denying images that match no policy."
  red_flags:
    - "Image tag `:latest` or any mutable tag without digest."
    - "Kyverno or policy-controller policy in `Audit` mode, or excluding the production namespace."
    - "Signature check with no pinned identity, for example a `--certificate-identity-regexp '.*'` or any-issuer rule."
    - "Cosign pinned below 2.6.2 (2.x) or 3.0.4 (3.x) in CI or the verifier."
    - "No provenance or SBOM produced by the build."
  where_to_look:
    - "Kubernetes Deployment/StatefulSet manifests and Helm values (image fields)"
    - "CI workflows (.github/workflows, .gitlab-ci.yml) for build, sign, attest steps"
    - "Kyverno ClusterPolicy, Sigstore ClusterImagePolicy, Gatekeeper constraints"
  needs_runtime_evidence: "That the cluster actually runs the policy in enforce mode and rejects unsigned, wrongly signed, and wrong-provenance images, and that the running digest matches the signed build. Recipe B10."
  na_when: "Only when the deployment runs no container image you build or choose (for example, a fully vendor-hosted agent). An unpinned or unsigned image is a Gap, not N/A."
  must_show:
    - id: B10.1
      check: "Production manifests reference images by digest (`@sha256:`), not by tag alone."
      verify: "1) Find every `image:` field in manifests, Helm values, compose, and Terraform. 2) Check each uses `@sha256:`. 3) Answer no if any production image uses only a tag (`:latest`, `:v1`), or a template defaults to a tag when the digest value is empty."
    - id: B10.2
      check: "An admission policy verifies the signature against a pinned key, or a pinned certificate identity and issuer, with no wildcard identity or issuer."
      verify: "1) Find admission policies (Kyverno `verifyImages`, `ClusterImagePolicy`, Gatekeeper). 2) Check the key or certificate identity and issuer are pinned. 3) Answer no if identity or issuer uses `.*` or wildcard regex, issuer is unset, or no admission policy exists. Answer unknown if admission config is outside this repo."
    - id: B10.3
      check: "The policy checks provenance fields: builder, source repository, build type, and external parameters."
      verify: "1) In the admission policy, find attestation or provenance conditions. 2) Check builder ID, source repository, build type, and `externalParameters` are each compared to expected values. 3) Answer no if any is missing, provenance is only generated in CI but not verified, or conditions use wildcards."
    - id: B10.4
      check: "The policy is in enforce mode, covers production namespaces, and denies images that match no policy."
      verify: "1) Read the policy mode and scope (`validationFailureAction`, `failureAction`, `mode`, namespace selectors, exclusions). 2) Check for a no-match deny. 3) Answer no if mode is `Audit` or `warn`, production namespaces are excluded or unmatched, `failurePolicy: Ignore`, or images matching no policy are allowed."
    - id: B10.5
      check: "The pinned Cosign or verifier version is at least 2.6.2 (2.x) or 3.0.4 (3.x)."
      verify: "1) Find Cosign or verifier versions in CI workflows (`cosign-installer`, `cosign-release`), Dockerfiles, and policy-controller charts. 2) Compare to 2.6.2 (2.x) and 3.0.4 (3.x). 3) Answer no if any pin is lower or uses `latest` or no version. Answer unknown if no verifier is in this repo."
  not_covered:
    - problem: "Tool or MCP server package not vetted or pinned"
      owner: E02
    - problem: "Model weights or adapters loaded without a signature or format check"
      owner: C05
    - problem: "Image runs as root or includes a shell or package manager"
      owner: B11
    - problem: "Secrets baked into the image"
      owner: B03

B11:
  provable_from_code: "partly"
  look_for:
    - "Pod `securityContext` meeting Pod Security 'restricted': `runAsNonRoot: true`, `allowPrivilegeEscalation: false`, `capabilities.drop: ['ALL']`, `seccompProfile.type: RuntimeDefault`."
    - "Namespace label `pod-security.kubernetes.io/enforce: restricted`."
    - "Where supported, `readOnlyRootFilesystem: true` and user namespaces (`hostUsers: false`)."
    - "Minimal base image (distroless, scratch, or chainguard) with no shell, curl/wget, or package manager in the final stage."
    - "For running untrusted or model-written code, a stronger sandbox such as gVisor (`runtimeClassName: gvisor`), Kata, or Firecracker microVMs."
  red_flags:
    - "`securityContext.privileged: true`, `allowPrivilegeEscalation: true`, or added capabilities like `SYS_ADMIN` or `NET_ADMIN`."
    - "Dockerfile with no `USER` line (runs as root) or `USER root` in the final stage."
    - "Final image includes `bash`, `curl`, `apt`, `pip`, or `npm` that the agent doesn't need."
    - "`hostPath` mounts, the Docker socket, or host network/PID namespaces."
    - "Model-generated code run with `subprocess`, `exec`, or a code tool inside the agent's own container with no separate sandbox."
  where_to_look:
    - "Dockerfile (base image, final stage, USER)"
    - "Pod specs, Helm templates, namespace labels"
    - "Code-execution tool implementation and its runtime"
    - "Managed runtime docs or provider isolation evidence"
  needs_runtime_evidence: "That host access is blocked from inside the running sandbox, and for managed runtimes, the provider's isolation evidence. Recipe B11 probes host marker files and unmounted paths."
  na_when: "never"
  must_show:
    - id: B11.1
      check: "Container settings set non-root, no privilege escalation, all capabilities dropped, and a seccomp profile, matching Pod Security 'restricted' or the same controls."
      verify: "1) Find pod `securityContext` and container `securityContext`, plus namespace labels. 2) Check `runAsNonRoot: true`, `allowPrivilegeEscalation: false`, `capabilities.drop: [ALL]`, `seccompProfile: RuntimeDefault`. 3) Answer no if any is missing on any container (including init and sidecars), set the wrong way, or overridden per container, or the Dockerfile runs as root with no override."
    - id: B11.2
      check: "The final image has no shell, downloader, or package manager the agent does not need."
      verify: "1) Read the final stage of each Dockerfile (after the last `FROM`). 2) Check base image and installs for `bash`, `sh`, `curl`, `wget`, `apt`, `apk`, `pip`, `npm`. 3) Answer no if the final image has any the agent does not need, or the final stage is a full OS image (ubuntu, debian, python) not distroless or scratch."
    - id: B11.3
      check: "There is no privileged mode, hostPath or Docker socket mount, or host network or PID namespace."
      verify: "1) Search manifests and compose for `privileged`, `hostPath`, `docker.sock`, `hostNetwork`, `hostPID`, `hostIPC`, `network_mode: host`, `pid: host`. 2) Answer no if any appears on the agent's workloads, including sidecars and init containers."
    - id: B11.4
      check: "If the agent runs untrusted or model-written code, that code runs in a separate sandbox such as gVisor, Kata, or a microVM, not in the agent's own container."
      verify: "1) Find code execution tools (`subprocess`, `exec`, `eval`, `child_process`, `os/exec`, code interpreter). 2) Check where that code runs (`runtimeClassName: gvisor`, Kata, Firecracker, remote sandbox API). 3) Answer no if model-written or untrusted code runs in the agent's own process or container, or the sandbox call falls back to local execution on error. Answer yes if no such code runs."
  not_covered:
    - problem: "Container image not pinned by digest or signature-checked"
      owner: B10
    - problem: "Outbound traffic to unapproved internet destinations"
      owner: B09
    - problem: "Network path to admin systems or other tenants' resources"
      owner: B08

B12:
  provable_from_code: "partly"
  look_for:
    - "Harness code, system prompt, and rules files (for example `CLAUDE.md`, `AGENTS.md`, `.cursorrules`, prompt templates) kept in version control, not edited in a dashboard."
    - "CODEOWNERS entries covering prompts and harness, with required reviews."
    - "Deploy only from CI on the reviewed branch, with the deployed version linked to a commit, tag, or digest."
    - "Branch protection or rulesets that block force-push and history rewrites (often visible in IaC such as Terraform `github_branch_protection`)."
  red_flags:
    - "System prompt loaded at run time from a database, remote URL, or feature flag that can change without review."
    - "Prompts or rules files outside the reviewed repo, or no CODEOWNERS for them."
    - "Deploy scripts that allow manual pushes to production from a laptop."
    - "Prompt text assembled from env vars with no recorded version."
  where_to_look:
    - "prompts/, rules files, harness source"
    - "CODEOWNERS, .github/ rulesets, branch protection IaC"
    - "CI/CD deploy workflows and release manifests"
  needs_runtime_evidence: "That running digests match reviewed sources, and that low-privilege edits and force-pushes fail. Branch protection lives in repo settings, not code. Recipe B12."
  na_when: "never"
  must_show:
    - id: B12.1
      check: "The harness, system prompt, and rules files are in version control and loaded from the reviewed build, not fetched at run time from a database, URL, or feature flag."
      verify: "1) Find where the system prompt and rules are loaded (`system_prompt`, `CLAUDE.md`, `AGENTS.md`, `prompts/`). 2) Check they come from files in the repo or build. 3) Answer no if any part is fetched at run time from a database, URL, feature flag, or env var with no recorded version, or a remote source overrides the file when available."
    - id: B12.2
      check: "CODEOWNERS or required-review rules cover the prompt, rules, and harness files."
      verify: "1) Read `CODEOWNERS` and review rules (`.github/`, rulesets, branch protection IaC). 2) Check patterns match prompt, rules, and harness paths. 3) Answer no if those paths are uncovered, the pattern misses them (wrong glob, case), or no CODEOWNERS exists. Answer unknown if required reviews are set only in repo settings outside the code."
    - id: B12.3
      check: "Production deploys run only from CI on the reviewed branch and record the commit, tag, or digest deployed."
      verify: "1) Read deploy workflows and scripts. 2) Check deploy triggers only on the reviewed branch and records commit, tag, or digest. 3) Answer no if `workflow_dispatch` or a script deploys any branch or local build, deploy scripts accept manual laptop pushes, or no version is recorded. Answer unknown if deploy is outside this repo."
    - id: B12.4
      check: "Branch protection config blocks force-pushes and history rewrites on the source branch."
      verify: "1) Search for branch protection IaC (`github_branch_protection`, rulesets JSON). 2) Check force-push and deletion are blocked on the source branch. 3) Answer no if `allow_force_pushes: true` or bypass is open to the agent's identity. Answer unknown if protection is set only in repo settings and not in code."
  not_covered:
    - problem: "Running config drifting from the approved baseline"
      owner: C04
    - problem: "Model or dependency change promoted without review and re-testing"
      owner: C05
    - problem: "A tool server changing its description or schema after approval"
      owner: E03
    - problem: "Release candidate not re-tested against attack cases"
      owner: C06
