# BRACE Run-time (R) review heuristics. Hand-written.
# Used by the brace-review skill to judge R01-R14 from an agent's code and config.
# Framework names are examples, not requirements.

R01:
  provable_from_code: partly
  look_for:
    - "A list of every input source: user input, API responses (errors and streams), tool and MCP output, webhooks and callbacks, messages from other agents, fetched pages, files, and retrieved chunks."
    - "Schema and type checks on tool and API results before they reach the model, for example Pydantic or Zod models, JSON Schema, or OpenAI Agents SDK output types."
    - "Size limits on bodies, files, and streamed chunks, enforced before content is used."
    - "Sender checks: webhook signature verification (for example HMAC with constant-time compare), mTLS, or token checks on callbacks."
    - "A content check for injection or attack payloads (for example an input guardrail or scanner) with a reject or quarantine path."
    - "Fail-closed handling: if a validator errors or times out, the content is dropped or held, not passed on."
  red_flags:
    - "Raw `response.text` or tool output passed straight into messages with no type, size, or content check."
    - "Webhook handlers that parse the body without verifying a signature, or compare signatures with `==`."
    - "`try: validate(x) except Exception: pass` or similar code that forwards content when a check fails."
    - "Content from internal services or authenticated APIs trusted by default with no checks."
    - "Streamed responses fed token by token to the model or a tool with no limit or buffering."
  where_to_look:
    - "Tool wrappers and MCP client code"
    - "HTTP clients, webhook and callback handlers"
    - "Retrieval and file-loading code"
    - "Guardrail config (OpenAI Agents SDK input guardrails, NeMo Guardrails, Claude Agent SDK `PostToolUse` hooks)"
  needs_runtime_evidence: "That hostile, oversized, faked, and broken payloads from each integration are rejected, and that disabling a check fails closed. Recipe R01 uses mock integrations."
  na_when: "never"
  must_show:
    - id: R01.1
      check: "Every input path passes through validation code: API and tool responses (including errors and streams), webhooks and callbacks, agent messages, user input, fetched pages, files, and retrieved chunks."
      verify: "1) List every input: tool and API responses (errors, streams), webhooks, agent messages, user input, fetched pages, files, retrieved chunks. 2) Trace each to where it enters the model context. 3) Answer no if any path, including error bodies, stream chunks, or a second handler, reaches the model without passing validation code."
    - id: R01.2
      check: "Type, schema, and size checks run before content, including streamed chunks, is added to the model context or executed."
      verify: "1) Find validation code (`pydantic`, `zod`, `jsonschema`, size limits, `max_bytes`, content-type checks). 2) Check it runs before content is added to the context or executed, including per stream chunk. 3) Answer no if validation runs after use, only on success responses, streams skip it, or there is no size limit."
    - id: R01.3
      check: "Senders are authenticated, and signatures are verified where the integration provides them, including for internal and authenticated services."
      verify: "1) Find webhook, callback, and inbound handlers. 2) Check sender authentication and signature verification (`hmac.compare_digest`, `verify_signature`, mTLS). 3) Answer no if any handler skips it, internal services are trusted without auth, the signature is compared with `==`, or a verify failure is caught and processing continues."
    - id: R01.4
      check: "Content is also screened for attack payloads or injection instructions, not only for structure."
      verify: "1) Find content screening (injection detector, pattern rules, classifier, encoded-payload checks). 2) Check it runs on content, not just schema. 3) Answer no if only type or schema checks exist, or screening covers some inputs (for example user input) but not tool output, fetched pages, or retrieved chunks."
    - id: R01.5
      check: "Bad payloads are rejected or held aside, and if a check errors, times out, or is skipped, the content is blocked."
      verify: "1) Find what happens when validation fails or errors. 2) Read `try`/`except`, `catch`, timeout, and default branches. 3) Answer no if failures log and continue, an error or timeout passes content through, a feature flag can skip checks, or bad content is truncated and still used."
  not_covered:
    - problem: "Injected instructions in valid content reaching forbidden tools unblocked"
      owner: R02
    - problem: "Hidden instructions in tool names, descriptions, or schemas"
      owner: E04
    - problem: "Replayed peer-agent requests with no freshness or nonce check"
      owner: E07
    - problem: "Secrets leaking into outputs or normal logs"
      owner: R03
    - problem: "Unapproved sources able to add documents to the retrieval corpus"
      owner: R04

R02:
  provable_from_code: partly
  look_for:
    - "Tool output and outside content placed in tool-result or user-role messages, never in the system or developer message."
    - "Source and trust labels on content, for example wrapping in tagged blocks with origin metadata."
    - "Containment in code that doesn't depend on the model: narrow credentials (B02), tool allowlists (B01), egress rules (B09), and destructive-action gates (B05)."
    - "Injection tests that repeat each attack and include adaptive versions, with results reported as structure checks, detection, and blocked side effects separately."
    - "High-impact actions draft-only or approval-gated where containment is uncertain."
  red_flags:
    - "Untrusted tool output concatenated into the system message or a policy prompt."
    - "Injection detection (a classifier, regex, or guardrail model) treated as the whole defense; detection alone is not containment."
    - "Retrieved documents or web pages formatted as instructions ('Follow these steps: ...') in the prompt."
    - "Injection tests run once each with no repeats or adaptive variants."
    - "The agent can read untrusted content and also send data out with no gate between them."
  where_to_look:
    - "Prompt and message-building code"
    - "Retrieval and tool-result formatting"
    - "Red-team or injection test suites"
    - "Action gates, credential scopes, and egress config that contain a followed injection"
  needs_runtime_evidence: "Success rates of planted injections, and proof that forbidden calls are blocked at enforcement. Recipe R02: plant an exfiltration instruction in schema-valid content, repeat with adaptive versions, and check the destination log."
  na_when: "never"
  must_show:
    - id: R02.1
      check: "Outside content (API responses, tool output, documents, connector messages) goes into user or tool message roles, never into the system or policy prompt."
      verify: "1) Find where model requests are built (`system=`, `messages`, `role: system`, prompt templates). 2) Trace outside content (tool output, documents, API responses) into the request. 3) Answer no if any outside content is concatenated into the system or policy prompt, including retrieved context or tool descriptions from servers."
    - id: R02.2
      check: "Each piece of outside content carries a source and trust label in the model request."
      verify: "1) Find where outside content is wrapped before the model request. 2) Check each piece carries a source and trust label. 3) Answer no if some sources (for example tool output or retrieved chunks) have no label, or labels are set by the content itself."
    - id: R02.3
      check: "Credential limits, tool permissions, and B05 action gates block the actions an injected instruction could cause, enforced in code the model cannot change."
      verify: "1) List actions an injected instruction could cause: sends, writes, deletes, fetches. 2) Check each is blocked by credential scope, tool allowlist, or B05 gate in harness code. 3) Answer no if any harmful action is stopped only by the model declining, or the limit can be changed by tool arguments or model output."
    - id: R02.4
      check: "Containment does not rely on prompt wording, delimiters, or an injection detector."
      verify: "1) Find the defenses relied on for injection. 2) Check whether removing prompt wording, delimiters, or the detector would leave harmful actions blocked. 3) Answer no if containment depends on system-prompt rules, delimiter tags, or a detector, with no code-level block behind it."
    - id: R02.5
      check: "Injection tests repeat each fixture a set number of times, include adaptive variants and schema-valid payloads, and report success rates."
      verify: "1) Find injection tests (`tests/`, eval suites, red-team fixtures). 2) Check fixtures repeat a set number of times, include adaptive variants and schema-valid payloads, and report a success rate. 3) Answer no if each test runs once, uses only malformed inputs, or reports pass/fail. Answer unknown if tests live outside this repo."
  not_covered:
    - problem: "Missing type, schema, or size checks on API responses"
      owner: R01
    - problem: "Hidden instructions in tool names, descriptions, or schemas"
      owner: E04
    - problem: "One run planting instructions in another run's memory"
      owner: R05
    - problem: "Generated output run as SQL or shell without parameterizing"
      owner: R03

R03:
  provable_from_code: partly
  look_for:
    - "Redaction of secrets and sensitive data before tool output, debug output, or errors reach the model, logs, or outside recipients (for example log filters, OpenTelemetry processors that drop or mask attributes)."
    - "Parameterized SQL (`cursor.execute(sql, params)`), argument lists for shell calls, and context-correct escaping for HTML."
    - "Markdown images and link previews blocked or limited to approved URLs in the client that shows agent output (for example a CSP `img-src` allowlist or a sanitizer that strips external images)."
    - "Tests with fake secret markers searched across model inputs, logs, and outside responses."
  red_flags:
    - "`subprocess(..., shell=True)` or `os.system` with model-generated text."
    - "SQL built with f-strings, `+`, or `.format()` from model output."
    - "Model output rendered as HTML with `innerHTML`, `dangerouslySetInnerHTML`, or `|safe` without sanitizing."
    - "Full prompts, tool payloads, or exception traces with credentials logged at INFO, or OpenTelemetry content capture (for example `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT=true`) on with no redaction."
    - "Chat UI renders Markdown images from any URL."
  where_to_look:
    - "Shell, SQL, and code-execution tools"
    - "Logging config and telemetry exporters"
    - "Chat UI rendering code and CSP headers"
    - "Error handlers that return messages to the model or user"
  needs_runtime_evidence: "That the fake-secret marker doesn't appear in any output path and the client doesn't fetch marker URLs. Recipe R03."
  na_when: "never"
  must_show:
    - id: R03.1
      check: "Secrets and sensitive fields are redacted from tool output, debug output, and error text before they reach the model, outside recipients, or normal logs."
      verify: "1) Find redaction code (`redact`, `mask`, secret patterns) and where tool output, errors, and debug text go. 2) Check redaction runs before the model, outside recipients, and logs. 3) Answer no if any path skips it, such as error messages, exception traces, debug logging, or `logger.info(response)` before redaction."
    - id: R03.2
      check: "The display client blocks auto-fetched URLs (Markdown images, link previews) or allows only approved hosts."
      verify: "1) Find the display client or renderer (Markdown render, link unfurl, image tags). 2) Check auto-fetched URLs are blocked or limited to approved hosts (CSP `img-src`, URL allowlist). 3) Answer no if Markdown images or previews load any URL. Answer unknown if the display client is outside this repo."
    - id: R03.3
      check: "Generated SQL uses parameterized queries, shell calls use argument lists with no string-built commands, and HTML output is escaped for its context."
      verify: "1) Search for SQL, shell, and HTML built from generated output (`execute(f`, `+ query`, `shell=True`, `exec(`, `innerHTML`, `dangerouslySetInnerHTML`, `|safe`). 2) Check for parameters, argument lists, and context escaping. 3) Answer no if any query or command is string-built, uses `shell=True` or `sh -c` with model input, or HTML is unescaped."
    - id: R03.4
      check: "Redacted audit evidence is kept rather than discarded."
      verify: "1) Find redaction code and audit logging. 2) Check redacted records are written to an audit store. 3) Answer no if redaction drops the whole record, or the evidence is discarded instead of kept."
  not_covered:
    - problem: "A tool call sending data to an unapproved destination"
      owner: B09
    - problem: "Long-lived secrets checked into config or baked into images"
      owner: B03
    - problem: "Incoming hostile payloads not validated"
      owner: R01
    - problem: "Retrieval returning another tenant's documents"
      owner: R04

R04:
  provable_from_code: partly
  look_for:
    - "Write access to the index limited to named ingestion identities and sources."
    - "Per-chunk metadata for source, time added, trust level, and access permissions (for example in vector-store metadata fields)."
    - "Tenant access enforced in the search query itself, for example a required metadata filter or a separate namespace or collection per tenant."
    - "Code paths to quarantine, expire, and revoke chunks, and to clear search caches."
  red_flags:
    - "One shared vector collection for all tenants with no tenant filter on search."
    - "Tenant filter applied after retrieval, or by the model, instead of in the query."
    - "The agent itself can write to the index (for example an `add_documents` tool) with no review."
    - "Chunks stored with no source or access metadata, so they can't be found or revoked later."
    - "Search results cached with no invalidation on revoke."
  where_to_look:
    - "Ingestion pipelines and loaders"
    - "Vector-store client code (Pinecone, Weaviate, pgvector, Chroma, OpenSearch)"
    - "Retriever setup (for example LangChain retriever `search_kwargs` filters)"
    - "Cache layers in front of search"
  needs_runtime_evidence: "That cross-tenant searches return nothing and that revoked, expired, or quarantined chunks leave search results and caches within the stated time. Recipe R04."
  na_when: "Only when the agent has no retrieval corpus or search index."
  must_show:
    - id: R04.1
      check: "Only named identities and sources can add or change index content, and the ingestion path checks the writer."
      verify: "1) Find index write paths (`upsert`, `add_documents`, `index`, ingestion jobs). 2) Check each verifies the writer identity or source against a named list. 3) Answer no if any write path, including the agent's own tools or an admin endpoint, accepts writes without that check."
    - id: R04.2
      check: "Each stored chunk has metadata for source, time added, trust level, and access permissions."
      verify: "1) Find chunk write code and metadata fields. 2) Check source, time added, trust level, and access permissions are stored on every chunk. 3) Answer no if any field is missing, or set only on some ingestion paths."
    - id: R04.3
      check: "Search applies the requesting tenant's access filter at query time, in the store or retrieval code, not after the model answers."
      verify: "1) Find search calls (`similarity_search`, `query`, `search`, `filter=`, `where=`). 2) Check a tenant or access filter is applied in the store query, from the caller's identity. 3) Answer no if filtering happens after retrieval or in the prompt, the filter is optional, or the tenant comes from a model-supplied argument."
    - id: R04.4
      check: "Code can quarantine, expire, and revoke chunks, and it also clears or invalidates search caches."
      verify: "1) Find quarantine, expiry, and revoke code (`delete`, `quarantine`, `ttl`, `expires_at`). 2) Check search excludes those chunks and caches are cleared. 3) Answer no if any of the three operations is missing, or caches (query cache, embedding cache) are not invalidated."
  not_covered:
    - problem: "Memory entries poisoned or shared across tenants"
      owner: R05
    - problem: "Agent credentials allowing another tenant's data at the API"
      owner: B02
    - problem: "Retrieved chunks not checked for size, type, or hidden instructions"
      owner: R01
    - problem: "Embedding or reranker model swapped without review"
      owner: C05

R05:
  provable_from_code: partly
  look_for:
    - "Memory keys or namespaces that include tenant, agent type, instance, and task as needed (for example LangGraph store namespaces, per-thread checkpointers)."
    - "Validation on memory writes, including content that arrives through ordinary queries, with only defined fields allowed."
    - "A review step before agent output moves into shared or long-lived memory."
    - "Expiry (TTL) on unverified entries, and sharing off by default."
  red_flags:
    - "One global memory store or key with no tenant or instance scope."
    - "The agent writes free text to persistent memory through a tool with no checks."
    - "Summaries of the agent's own output saved as trusted memory with no review."
    - "Memory entries that never expire."
  where_to_look:
    - "Memory or store modules, LangGraph `BaseStore`/checkpointer setup, Mem0 or similar config"
    - "Memory write tools"
    - "Session and thread handling"
  needs_runtime_evidence: "That a poisoned run can't plant instructions in another run's memory and that cross-scope reads and writes fail. Recipe R05."
  na_when: "Only when the agent has no memory that lasts between runs."
  must_show:
    - id: R05.1
      check: "Memory reads and writes are scoped by tenant, agent type, instance, and task as needed, and cross-scope access is denied unless explicitly allowed."
      verify: "1) Find memory read and write code (`memory`, `store`, `namespace`, keys). 2) Check keys include tenant, agent type, instance, or task as needed. 3) Answer no if keys omit tenant, the scope comes from a model argument, or reads fall back to a shared or global namespace."
    - id: R05.2
      check: "Every memory write, including content arriving through ordinary queries, passes validation before it is stored."
      verify: "1) List every memory write path, including automatic saves from ordinary conversation. 2) Check each passes validation before storing. 3) Answer no if any path writes without validation, or validation errors are caught and the write continues."
    - id: R05.3
      check: "The agent's own output cannot reach trusted or shared memory without a review step."
      verify: "1) Find where agent output is written to shared or trusted memory. 2) Check a review step gates the write. 3) Answer no if agent output goes straight into shared or trusted memory, or the review flag defaults to approved."
    - id: R05.4
      check: "Unverified entries have an expiry that is enforced."
      verify: "1) Find how unverified entries are marked and expired (`ttl`, `expires_at`, cleanup jobs). 2) Check reads filter out expired entries. 3) Answer no if no expiry is set, it is set but never enforced on read or by a job, or the default is no expiry."
  not_covered:
    - problem: "No record of who wrote a memory entry, or no way to remove it"
      owner: R06
    - problem: "Retrieval search not filtered by the requesting tenant"
      owner: R04
    - problem: "Agent credentials allowing another tenant's data at the API"
      owner: B02
    - problem: "Rollback restoring old memory or index state unchecked"
      owner: C07

R06:
  provable_from_code: partly
  look_for:
    - "Each memory entry stores writer, time, task, source input, and context size at write time."
    - "Summaries and derived entries keep links to their sources."
    - "Code or runbooks to find entries by source or writer, quarantine or delete them, and clear related caches."
  red_flags:
    - "Memory rows with only content and a timestamp, no writer or source fields."
    - "Summaries that replace source entries and drop their links."
    - "No delete or quarantine function for memory, or one that skips caches and derived entries."
  where_to_look:
    - "Memory schema or data model"
    - "Summarization and compaction code"
    - "Admin or cleanup scripts"
  needs_runtime_evidence: "That a tainted entry and its related entries can be found and removed, and later sessions don't retrieve them. Recipe R06."
  na_when: "Only when the agent has no memory that lasts between runs."
  must_show:
    - id: R06.1
      check: "Each memory entry stores its writer, time, task, source input, and context size at write time."
      verify: "1) Find the memory entry schema. 2) Check fields for writer, time, task, source input, and context size. 3) Answer no if any is missing, or set only on some write paths."
    - id: R06.2
      check: "Derived entries such as summaries keep links to the entries they came from."
      verify: "1) Find summary or derived-entry creation code. 2) Check it stores links to source entry IDs. 3) Answer no if derived entries keep no source links."
    - id: R06.3
      check: "Code can find entries by source or writer and quarantine or delete them, along with derived entries and caches."
      verify: "1) Find code that queries by source or writer and quarantines or deletes. 2) Check it also handles derived entries and caches. 3) Answer no if lookup by source or writer is impossible, or derived entries and caches are left in place."
    - id: R06.4
      check: "Quarantined or deleted entries are excluded from retrieval in later sessions."
      verify: "1) Find memory retrieval code. 2) Check it excludes quarantined or deleted entries in new sessions. 3) Answer no if retrieval ignores the quarantine flag, or a cache or index still returns removed entries."
  not_covered:
    - problem: "Memory not separated by tenant, agent type, instance, or task"
      owner: R05
    - problem: "Poisoned retrieval documents not quarantined or expired"
      owner: R04
    - problem: "Context size not logged for each action decision"
      owner: R07
    - problem: "Prompt a parent gave a sub-agent not recorded"
      owner: A06

R07:
  provable_from_code: partly
  look_for:
    - "Context size in tokens recorded on each action span or log record, for example OpenTelemetry `gen_ai.usage.input_tokens` plus a BRACE context-size attribute per `otel-conventions.md`."
    - "A documented counting method that covers cached input and compaction, and marks each value as measured, estimated, or unavailable."
    - "Compaction recorded, for example the `gen_ai.conversation.compacted` attribute."
    - "The value carried across tool handoffs and stored next to the action's identity and result."
  red_flags:
    - "No token or context-size field on action records."
    - "Missing values written as `0` instead of null or 'unknown'."
    - "Per-call billing totals used as context size with no stated method showing they match."
    - "Context size logged per run only, not per action."
  where_to_look:
    - "OpenTelemetry instrumentation and span attributes"
    - "Model-call wrappers and usage handling"
    - "Compaction or summarization code"
  needs_runtime_evidence: "That logged values match the counting method across short, long, cached, and compacted contexts, and are searchable per action. Recipe R07."
  na_when: "never"
  must_show:
    - id: R07.1
      check: "Each action record includes the model's context size in tokens at decision time."
      verify: "1) Find action or tool-call records (trace spans, audit logs). 2) Check each has context size in tokens at decision time. 3) Answer no if the field is missing or recorded only per run, not per action."
    - id: R07.2
      check: "Each value is labeled measured, estimated, or unavailable, and a missing value is stored as unknown, never as zero."
      verify: "1) Find where context size is recorded. 2) Check a label of measured, estimated, or unavailable, and how missing values are stored. 3) Answer no if there is no label, or a missing value defaults to `0` (`or 0`, `?? 0`, `.get(..., 0)`)."
    - id: R07.3
      check: "The count comes from a stated method that handles cached input and compaction, not a copied per-call billing total."
      verify: "1) Find how context size is counted. 2) Check a stated method covers cached input and compaction. 3) Answer no if it copies `usage.input_tokens` or a billing total with no stated method that matches it, or ignores cache and compaction."
    - id: R07.4
      check: "The value is carried across tool handoffs and stored with the action's identity, result, and trace ID."
      verify: "1) Trace context size through tool handoffs and sub-agent calls. 2) Check it is stored with action identity, result, and trace ID. 3) Answer no if it is lost on handoff, or stored separately with no link to the action."
  not_covered:
    - problem: "Behavior not compared across context-size ranges"
      owner: R09
    - problem: "Token or cost limits not enforced outside the model"
      owner: B07
    - problem: "Action records missing any of the six identity fields"
      owner: A02

R08:
  provable_from_code: partly
  look_for:
    - "Security detection rules kept apart from answer-quality evals, for example SIEM rules, Falco rules, or alert definitions in the repo."
    - "Rules for encoded payloads, unexpected outbound traffic, out-of-scope writes, privilege escalation, and repeated denied calls."
    - "Denials and policy decisions emitted as events that rules can match."
    - "Alert routing to a named responder (for example PagerDuty or Opsgenie routing config)."
  red_flags:
    - "Only quality or eval monitoring (LangSmith, Langfuse, Phoenix scores) with no security rules."
    - "Denied tool calls logged at DEBUG or not logged at all."
    - "Alerts sent to a shared channel with no named owner."
  where_to_look:
    - "Detection-as-code repos, SIEM or Falco rule files"
    - "Alerting and on-call routing config"
    - "Policy-decision logging in the harness"
  needs_runtime_evidence: "That each rule fires on test traffic, stays quiet on a harmless control, and reaches the responder in time. Recipe R08. Rules often live outside the agent repo."
  na_when: "never"
  must_show:
    - id: R08.1
      check: "Security detection rules and baselines are defined separately from answer-quality monitoring."
      verify: "1) Find detection rules and monitoring config (SIEM rules, alert config, eval dashboards). 2) Check security rules are separate from answer-quality metrics. 3) Answer no if only quality monitoring exists. Answer unknown if monitoring lives outside this repo."
    - id: R08.2
      check: "Rules exist for encoded payloads, unexpected outbound traffic, out-of-scope writes, privilege escalation, and repeated denied calls."
      verify: "1) Read the security detection rules. 2) Check for encoded payloads, unexpected outbound traffic, out-of-scope writes, privilege escalation, and repeated denied calls. 3) Answer no if any is missing, or denied calls are never logged so the rule cannot fire."
    - id: R08.3
      check: "Alerts from these rules route to a named responder or on-call target in config."
      verify: "1) Find alert routing (PagerDuty, Opsgenie, alertmanager receivers, on-call config). 2) Check the security rules route to a named responder. 3) Answer no if alerts go only to a dashboard or log, or the receiver is empty. Answer unknown if routing lives outside this repo."
  not_covered:
    - problem: "Chains of individually allowed actions going undetected"
      owner: R09
    - problem: "No test of a second-model review against evasive behavior"
      owner: R10
    - problem: "No drill for a compromised shared tool or agent type"
      owner: E12
    - problem: "Rate and cost limits not enforced outside the model"
      owner: B07

R09:
  provable_from_code: partly
  look_for:
    - "Detection over sequences of allowed actions, for example many reads followed by an outside send, repeated denials, unusual fan-out, or a used-up budget."
    - "Thresholds or baselines split by context-size range."
    - "A pre-action checker that compares high-impact actions with the original task and does not receive the untrusted content in between."
    - "Labeled harmless and abusive sequences used to measure catches and false alarms."
  red_flags:
    - "Only per-call rules; nothing looks at chains of actions."
    - "One fleet-wide baseline with no split by context size."
    - "A task-alignment checker given the full conversation, including untrusted tool output."
  where_to_look:
    - "Detection rules and analytics jobs"
    - "Pre-execution hooks or guardrails"
    - "Detection test fixtures"
  needs_runtime_evidence: "Catch and false-alarm rates per context-size range against thresholds set before the run. Recipe R09."
  na_when: "never"
  must_show:
    - id: R09.1
      check: "Detection rules evaluate sequences of calls across a run (for example many reads followed by an outside send), not only single calls."
      verify: "1) Read detection rules. 2) Check rules evaluate sequences across a run, such as many reads then an outside send. 3) Answer no if every rule looks at a single call or event."
    - id: R09.2
      check: "Rules cover unusual fan-out and resource use."
      verify: "1) Read detection rules. 2) Check rules for unusual fan-out (sub-agents, parallel calls) and resource use. 3) Answer no if neither is covered."
    - id: R09.3
      check: "Thresholds or baselines are set per context-size range, not as one fleet-wide value."
      verify: "1) Read rule thresholds and baselines. 2) Check they are set per context-size range. 3) Answer no if one fleet-wide value is used for all contexts."
    - id: R09.4
      check: "If hijack through allowed tools alone is possible, each high-impact action is checked against the original task before it runs, by a checker that is not given the untrusted content."
      verify: "1) Check whether allowed tools alone could cause harm if the agent is hijacked. 2) If so, find a task-alignment checker before high-impact actions and see what input it receives. 3) Answer no if no checker exists, it is given the untrusted content, or its errors let the action proceed."
  not_covered:
    - problem: "Encoded payloads or writes outside scope going undetected"
      owner: R08
    - problem: "No test against a deliberately evasive, misaligned agent"
      owner: R10
    - problem: "Context size not logged for each action decision"
      owner: R07

R10:
  provable_from_code: "no"
  look_for:
    - "A second-model or pattern reviewer of actions and arguments, with a written record of what it can see, including whether reasoning is visible."
    - "A labeled review set with evasive traces (for example a forbidden operation split across calls) and red-team traces from an agent told it is watched."
    - "Rule-based access and action controls that stay in place alongside the reviewer."
  red_flags:
    - "A reviewer model used in place of rule-based permission or approval controls."
    - "Claims that the model's intent is safe, with no measured misses or false positives."
    - "Reviewer sees only the final answer, not actions and arguments."
  where_to_look:
    - "Monitor or reviewer agent code and prompts"
    - "Red-team and evaluation results"
    - "Threat model stating whether deliberate misalignment is in scope"
  needs_runtime_evidence: "Measured misses and false alarms on a labeled evasive set, plus red-team runs. Code can only show a reviewer exists. Recipe R10."
  na_when: "Only when deliberate misalignment is recorded as out of scope for this deployment, with a reason and approval."
  must_show: []
  not_covered:
    - problem: "Destructive actions not blocked by a rule-based gate"
      owner: B05
    - problem: "A swapped, drifting, or failing checker model not treated as a failure"
      owner: A07
    - problem: "Chains of individually allowed actions going undetected"
      owner: R09

R11:
  provable_from_code: partly
  look_for:
    - "A stop path outside the agent's control, for example an operator-only flag in a separate service, scaling the deployment to zero, revoking the agent identity, or a gateway kill rule."
    - "The agent's credentials can't write to the stop flag or its config (check IAM and RBAC)."
    - "The harness checks the stop signal before each action and cancels running tool calls, streams, subscriptions, and background tasks."
    - "A written list of who may stop the agent and a maximum stop time."
  red_flags:
    - "Stop works by sending the agent a message or prompt asking it to halt."
    - "Stop flag stored where the agent can write, for example the same database, config map, or memory it uses."
    - "Stop checked only between turns, with no cancel for in-flight tool calls or streams."
    - "Sub-agents or background jobs not reached by the stop signal."
  where_to_look:
    - "Runner loop and cancellation handling"
    - "Ops scripts and runbooks for stopping the agent"
    - "IAM/RBAC for the stop control"
  needs_runtime_evidence: "A dated drill on the current deployment with measured stop time, including an in-progress tool call and an agent attempt to block the stop. Recipe R11. Sub-agents are covered by E09."
  na_when: "never"
  must_show:
    - id: R11.1
      check: "A stop control halts new model calls and new tool calls when set."
      verify: "1) Find the stop control (kill flag, `stop`, `halt`, feature flag, revoked token). 2) Check the loop checks it before every model call and tool call. 3) Answer no if it is checked only at run start, only between turns, a second loop or worker skips it, or a check error is treated as not stopped."
    - id: R11.2
      check: "The agent's own credentials and tools cannot set, clear, delete, or delay the stop control."
      verify: "1) Find where the stop flag is stored and who can write it. 2) Compare with the agent's credentials and tools. 3) Answer no if the agent's role can write, delete, or expire the flag, a tool can reach its store, or the agent can delay it (for example by catching the stop signal)."
    - id: R11.3
      check: "Tool calls already running are cancelled or bounded by a timeout when the stop is set."
      verify: "1) Find the stop handler. 2) Check running tool calls are cancelled or bounded by a timeout. 3) Answer no if running calls finish with no timeout, or cancellation errors are swallowed and the call continues."
    - id: R11.4
      check: "The stop also closes open tool streams, subscriptions, and background tasks."
      verify: "1) Find streams, subscriptions, and background tasks (`asyncio.create_task`, goroutines, websockets, SSE). 2) Check the stop handler closes them. 3) Answer no if any is left open, detached, or untracked."
    - id: R11.5
      check: "Only named operator identities can set the stop control."
      verify: "1) Find who can set the stop (auth on the endpoint, IAM on the flag store). 2) Answer no if any authenticated user or service can set it with no named operator list. Answer unknown if access lives outside this repo."
  not_covered:
    - problem: "Stop signal not reaching sub-agents, children, or remote workers"
      owner: E09
    - problem: "In-flight writes, queued actions, or unattended restarts after the stop"
      owner: R12
    - problem: "No way to cut off the agent's access without cutting off the user"
      owner: B04

R12:
  provable_from_code: partly
  look_for:
    - "A per-operation record of whether it can be blocked, canceled, or only reconciled afterward."
    - "On stop: queues drained or held, retries turned off, and in-flight transactions rolled back."
    - "Reconcile or compensate code for outside side effects, and unclear results sent to a named operator."
    - "Restart requires an operator; no auto-restart policy resumes agent work."
  red_flags:
    - "Kubernetes `restartPolicy: Always` or a supervisor that resumes the agent's queue after a stop with no human step."
    - "Queued jobs or scheduled tasks that keep their credentials and run after the stop."
    - "Retries with backoff on outside actions that keep going during or after a stop."
    - "Stop handled only by killing the process."
  where_to_look:
    - "Job queues, workers, and schedulers"
    - "Shutdown and signal handlers"
    - "Retry config and compensation code"
  needs_runtime_evidence: "Outcomes of stops before a write, mid-transaction, and after an outside action, with queue and destination snapshots. Recipe R12."
  na_when: "never"
  must_show:
    - id: R12.1
      check: "For each operation type, code or config states whether it can be cancelled, completed, or only reconciled after a stop."
      verify: "1) Search code and config for a per-operation stop policy (cancel, complete, reconcile). 2) Answer no if any operation type the agent can run has no stated stop behavior."
    - id: R12.2
      check: "On stop, queued actions are cancelled or held, and automatic retries are turned off."
      verify: "1) Find queue and retry code (`retry`, `backoff`, queue workers). 2) Check stop cancels or holds queued items and turns retries off. 3) Answer no if retries continue after stop or queued jobs still run."
    - id: R12.3
      check: "Unclear or in-progress outside actions go on a tracked hold with an owner, and dependent actions are blocked until reconciled."
      verify: "1) Find handling of unclear or in-progress outside actions at stop. 2) Check they go on a tracked hold with an owner and block dependent actions. 3) Answer no if they are dropped, retried, or dependents proceed."
    - id: R12.4
      check: "A stopped run does not restart on its own; restart needs an operator action."
      verify: "1) Find restart logic (supervisors, `restartPolicy`, cron, auto-resume). 2) Answer no if a stopped run restarts automatically (`restartPolicy: Always`, auto-resume from checkpoint) without an operator action."
    - id: R12.5
      check: "Workers and queued jobs lose their credentials or authority at stop, so no orphaned work can act."
      verify: "1) Find workers and queued jobs and the credentials they hold. 2) Check stop revokes or expires them. 3) Answer no if workers keep long-lived credentials after stop, or jobs carry their own tokens that stay valid."
  not_covered:
    - problem: "Stop path depends on the agent or has no tested stop time"
      owner: R11
    - problem: "Recovery replay repeating irreversible actions or using tampered checkpoints"
      owner: R14
    - problem: "Rollback restoring revoked permissions"
      owner: C07

R13:
  provable_from_code: partly
  look_for:
    - "A linked trace per run (for example OpenTelemetry spans with parent links) covering proposed actions, tool calls with key arguments, authorization decisions with policy version, denials, approvals with IDs, results, errors, and timestamps."
    - "An operation ID assigned before each outside call, and destination receipts or status checks stored."
    - "Unresolved results marked clearly, with dependent actions paused."
    - "Audit records written to a store the agent can't change."
  red_flags:
    - "Only the final answer or chat transcript is stored."
    - "Denials and approval decisions not logged, or logged without the policy version."
    - "Trace sampling (for example `TraceIdRatioBased` below 1.0) applied to the action audit."
    - "Timeouts logged as failures with no marker that the result is unknown."
  where_to_look:
    - "Tracing and logging setup, span attributes"
    - "Policy and approval decision code"
    - "Audit storage config and retention"
  needs_runtime_evidence: "That a known run with an allowed call, denial, approval, error, and retry can be rebuilt from stored records alone and matches destination logs. Recipe R13."
  na_when: "never"
  must_show:
    - id: R13.1
      check: "Each step writes a record linked to the run: proposed action, tool call with key arguments, result, error, and timestamp."
      verify: "1) Find step logging (trace spans, audit log writes). 2) Check each record has run ID, proposed action, tool call with key arguments, result, error, and timestamp. 3) Answer no if any field is missing, or logging happens only on the success branch."
    - id: R13.2
      check: "Authorization decisions are recorded with the policy version, including denials, not only allowed calls."
      verify: "1) Find authorization decision code. 2) Check both allow and deny are logged with the policy version. 3) Answer no if denials are not logged, or no policy version is recorded."
    - id: R13.3
      check: "Approved actions record their approval ID."
      verify: "1) Find where approved actions are logged. 2) Answer no if the approval ID is not recorded with the action."
    - id: R13.4
      check: "Tool errors, timeouts, and retries are recorded, and each operation gets an ID before it is sent, so unclear results can be matched to the destination's records."
      verify: "1) Find error, timeout, and retry handling. 2) Check each is logged and each operation gets an ID before sending. 3) Answer no if `except`/`catch` blocks skip logging, retries are not logged, or the ID is created after the response."
    - id: R13.5
      check: "Records are written by the harness or gateway, not by the model, and do not depend on the run's final answer."
      verify: "1) Find who writes records. 2) Answer no if the model writes them via a tool, records are built from the final answer, or logging runs only if the run completes."
  not_covered:
    - problem: "Action records missing any of the six identity fields"
      owner: A02
    - problem: "Agent able to erase or rewrite its own audit history"
      owner: E10
    - problem: "Audit retention, access, redaction, or export rules missing"
      owner: E11
    - problem: "Run can't be rebuilt across gateway, tool services, and delegated workers"
      owner: E10
    - problem: "Prompt a parent gave a sub-agent not recorded"
      owner: A06

R14:
  provable_from_code: partly
  look_for:
    - "Checkpoints and recovery logs signed or hash-chained, and verified against a separately protected key or trust anchor before use."
    - "Checks that catch truncation, rollback to an older checkpoint, and replacement of a whole chain (for example a signed head or sequence number stored elsewhere)."
    - "Idempotency keys sent to destinations that support them, for example `Idempotency-Key` headers."
    - "A durable operation record written before sending, and replay that pauses for reconciliation when a result is unclear."
  red_flags:
    - "LangGraph or similar checkpoints loaded from a writable store with no integrity check."
    - "Hash chain verified only against itself, with no outside anchor."
    - "Automatic replay or retry of payments, emails, or other permanent actions with no idempotency key."
    - "A local 'already sent' table used as the only duplicate guard."
  where_to_look:
    - "Checkpointer and resume code"
    - "Retry and replay logic in tool clients"
    - "Audit log storage and signing setup"
  needs_runtime_evidence: "That changed, truncated, rolled-back, and replaced checkpoints are rejected, and replays happen once or pause. Recipe R14."
  na_when: "Only when no logs or checkpoints drive recovery and there is no automatic replay."
  must_show:
    - id: R14.1
      check: "Checkpoints and audit records used for recovery are hash-chained or signed."
      verify: "1) Find checkpoint and audit storage used for recovery. 2) Check for hash chaining or signatures. 3) Answer no if records are plain rows or files with no chain or signature."
    - id: R14.2
      check: "Recovery verifies them against a key or trust anchor stored separately from the records, and refuses any that fail."
      verify: "1) Find recovery code that loads checkpoints. 2) Check it verifies against a key stored separately and refuses failures. 3) Answer no if the key sits in the same store, verification is skipped, or failure is logged and recovery continues."
    - id: R14.3
      check: "Verification catches truncation, rollback to an older valid checkpoint, and replacement of the whole chain, for example with a signed head or sequence number held outside the store."
      verify: "1) Check verification uses a signed head or sequence number held outside the store. 2) Answer no if truncation, rollback to an older valid checkpoint, or replacing the whole chain would still pass."
    - id: R14.4
      check: "Automatic replay sends idempotency keys that the destination enforces, and only for integrations that support them."
      verify: "1) Find replay code. 2) Check it sends idempotency keys (`Idempotency-Key`, `client_token`) only to integrations that enforce them. 3) Answer no if replay sends without keys, uses a local dedupe table as the only guard, or replays to integrations without support."
    - id: R14.5
      check: "When idempotency is missing or the result is unclear, replay pauses for reconciliation instead of resending."
      verify: "1) Find replay handling for unclear results or missing idempotency. 2) Answer no if replay resends instead of pausing for reconciliation, or retry is the default on timeout."
  not_covered:
    - problem: "What happens to in-flight writes and queued actions at stop"
      owner: R12
    - problem: "Rollback to an approved earlier release not tested"
      owner: C07
    - problem: "Agent able to delete or rewrite its own audit history"
      owner: E10
