met_in_code:
- item: B01
  where: config/tools.yaml:1
  why: Every built-in tool, the MCP server, APIs, programs (including the extension) and file paths are listed with task reasons;
    dispatch (src/tools/registry.ts:74) refuses ids not on the role allowlist, internal vault calls are bound to a named caller
    (registry.ts:84), MCP annotations are never consulted, and tests cover unlisted and wrong-role calls.
- item: R07
  where: src/telemetry.ts:24
  why: Each audit record carries the context size of the decision that proposed it, counted from provider usage including
    cache reads and writes, with a measured/estimated/unavailable method, a compaction flag, and 'unavailable' instead of
    zero when usage is missing.
- item: A07
  where: src/models.ts:37
  why: The price-extractor helper has a pinned snapshot record and an identity hash over model, adapter, prompt and params;
    each decision is audited with that identity, and a served-model mismatch or failure is recorded as control_failure and
    drops the offers.
- item: E08
  where: src/peers/deals.ts:29
  why: Peer calls use an RFC 8693 exchange with the user as subject and the agent workload as actor, audience DealsNet only,
    scope deals:query only, at most 300 s, and reject a broader token; the user's token never leaves, and the peer has no
    authority to act for the user.
