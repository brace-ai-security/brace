met_in_code:
- item: B01
  where: src/tools.py:145
  why: config/tools.yaml lists every tool, API, program (none), MCP server (none), and file permission with a task reason
    and per-role allowlist; dispatch rejects unlisted or role-disallowed tools and extra arguments, with tests in tests/test_tools.py.
- item: B11
  where: k8s/deployment.yaml:18
  why: Distroless nonroot image with no shell or package manager; every container runs non-root with seccomp RuntimeDefault,
    no privilege escalation, all capabilities dropped, a read-only root filesystem, and no SA token automount.
