    where: "k8s/image-policy.yaml:6"
    why: "Deployment pins the image by digest; a Kyverno ClusterPolicy in Enforce mode with failurePolicy Fail requires digests and verifies keyless signatures and SLSA provenance (build type, repository, workflow path, ref, builder) for every image in the namespace."
  - item: B11
    where: "k8s/deployment.yaml:65"
    why: "Distroless nonroot image with no shell or pip, runAsNonRoot, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp, read-only root filesystem, and hostUsers: false."
  - item: R04
    where: "sql/grants.sql:25"
    why: "Only the policy_ingest role can write chunks; each chunk stores source, writer, time, trust level, and tenant; row-level security plus the query filter limit search to the run's tenant and active, unexpired chunks, with no cache."

