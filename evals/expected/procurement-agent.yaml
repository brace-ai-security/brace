    where: "deploy/k8s/deployment.yaml:21"
    why: "Distroless nonroot image with no shell or package manager (Dockerfile), namespace enforces PSS restricted, pod sets hostUsers: false, runAsNonRoot, seccomp RuntimeDefault; container sets allowPrivilegeEscalation false, privileged false, readOnlyRootFilesystem, drop ALL; no SA token automount; only a memory-backed /tmp and read-only secret mounts."
  - item: R07
    where: "app/context_size.py:63"
    why: "Context size is measured per decision with the token-count endpoint on the exact request, falls back to a labelled usage-sum estimate, and is NULL with method 'unavailable' otherwise (DB check forbids 0); compaction is flagged; the measure is copied onto every tool record for that decision and the sub-agent's own decisions, in searchable columns next to the identity fields; method documented in README."

