    where: "src/tools/git.ts:42"
    why: "The push guard blocks only --force/--force-with-lease and short protected-branch names, so `-f` (allowed in PUSH_FLAGS), a `+main` refspec, or `HEAD:refs/heads/main` force-pushes or pushes to a protected branch with no approval."
