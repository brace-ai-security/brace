met_in_code:
- item: B01
  where: internal/tools/registry.go:77
  why: Per-role allowlist with a reason per tool in tools.yaml; handlers for unlisted tools are refused, Lookup denies anything
    not in the caller's role, unapproved MCP tools are never bound, and impact comes only from tools.yaml, not server annotations.
- item: B11
  where: deploy/k8s/deployment.yaml:11
  why: 'Distroless nonroot image, runAsNonRoot, no privilege escalation, all capabilities dropped, RuntimeDefault seccomp,
    read-only root filesystem and hostUsers: false; the agent runs no untrusted code.'
- item: A01
  where: terraform/iam.tf:24
  why: The agent has its own service account and IRSA role, trusted only for system:serviceaccount:cloudops:cloudops-agent,
    separate from any human; runs start from Alertmanager, not a user credential.
- item: E03
  where: internal/mcpclient/client.go:103
  why: Tool description and schema fingerprints are checked against approved values on load and on every tools/list_changed;
    any mismatch unbinds all of that server's tools, and the server binary is pinned by image digest.
- item: E04
  where: internal/mcpclient/scan.go:25
  why: Names, titles, descriptions, schemas and annotations are length-limited and scanned for invisible characters, override
    text, references to other tools, destinations and encoded payloads; a field that cannot be decoded rejects the tool, and
    server prompts and resources are never loaded.
