name: BRACE security map and action plan
description: >-
  Turns a BRACE review (brace-findings.json) and its component map into a security map,
  an action plan (web page, Markdown, JSON, CSV) and SARIF for code scanning,
  then fails the job on the threshold you choose. Runs no model and contacts no outside
  service except GitHub and PyPI (for its two pinned, hash-checked dependencies).
author: BRACE

inputs:
  findings:
    description: Path to the review's findings file.
    default: brace-findings.json
  topology:
    description: Path to the CycloneDX map. Built first when build-topology is true.
    default: brace-topology.cdx.json
  build-topology:
    description: "Build the map from the repository: .mcp.json, agent config, tools config and the reviewer's overlay."
    default: "false"
  agent-config:
    description: Agent config file for build-topology, e.g. config/agent.yaml.
    default: ""
  tools-config:
    description: Tools config file for build-topology, if separate, e.g. config/tools.yaml.
    default: ""
  fail-on:
    description: "Fail the job when an action matches: blocker (a Blocker gap), gap (any gap), any (any action), none."
    default: blocker
  strict:
    description: Fail when the plan has input notes (unknown map parts, missing fix steps, hard-to-read text, wrong file or line).
    default: "true"
  record:
    description: Recorded map to compare against. Leave empty to skip.
    default: .brace/topology.cdx.json
  record-drift:
    description: "What to do when the map differs from the record or no record exists: warn, fail or off."
    default: warn
  output-dir:
    description: Folder for the report files.
    default: brace-report
  upload-sarif:
    description: Upload SARIF to GitHub code scanning (needs permission security-events write).
    default: "true"
  upload-artifact:
    description: Upload the report folder as a workflow artifact.
    default: "true"
  python-version:
    description: >-
      Python version to install with actions/setup-python. Leave empty (the default) to use the
      runner's preinstalled Python 3.11+.
    default: ""

outputs:
  actions:
    description: Number of actions (gaps plus items needing proof).
    value: ${{ steps.plan.outputs.actions }}
  gaps:
    description: Number of gaps.
    value: ${{ steps.plan.outputs.gaps }}
  blocker-gaps:
    description: Number of Blocker gaps, which must be fixed before release.
    value: ${{ steps.plan.outputs.blocker_gaps }}
  record-status:
    description: "current, differs, missing or skipped."
    value: ${{ steps.record.outputs.status }}
  report-dir:
    description: Folder with the report files.
    value: ${{ inputs.output-dir }}

runs:
  using: composite
  steps:
    - if: inputs.python-version != ''
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install BRACE dependencies
      id: setup
      shell: bash
      run: |
        # A private virtual environment with hash-pinned PyYAML and jsonschema; the job's own
        # Python packages are left alone. BRACE itself runs from this Action's checkout.
        PY="$(command -v python3 || command -v python || true)"
        if [ -z "$PY" ] || ! "$PY" -I -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
          echo "::error::BRACE needs Python 3.11 or newer. Set the action's python-version input, for example python-version: '3.12'."
          exit 2
        fi
        VENV="${RUNNER_TEMP:-/tmp}/brace-plan-venv"
        "$PY" -I -m venv "$VENV"
        BIN="$VENV/bin"; [ -d "$BIN" ] || BIN="$VENV/Scripts"
        "$BIN/python" -I -m pip install --quiet --disable-pip-version-check --no-deps --require-hashes \
          --only-binary :all: -r "$GITHUB_ACTION_PATH/requirements.txt"
        echo "python=$BIN/python" >> "$GITHUB_OUTPUT"

    - name: Build the map
      if: inputs.build-topology == 'true'
      shell: bash
      env:
        PY: ${{ steps.setup.outputs.python }}
        TOPOLOGY: ${{ inputs.topology }}
        AGENT_CONFIG: ${{ inputs.agent-config }}
        TOOLS_CONFIG: ${{ inputs.tools-config }}
      run: |
        args=(map build . -o "$TOPOLOGY")
        [ -n "$AGENT_CONFIG" ] && args+=(--agent-config "$AGENT_CONFIG")
        [ -n "$TOOLS_CONFIG" ] && args+=(--tools-config "$TOOLS_CONFIG")
        # Names in the map come from the repository: stop the runner reading workflow commands.
        TOKEN="$("$PY" -I -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::$TOKEN"
        set +e
        "$PY" -I "$GITHUB_ACTION_PATH/brace_run.py" "${args[@]}"
        code=$?
        set -e
        echo "::$TOKEN::"
        exit $code

    - name: Write the action plan
      id: plan
      shell: bash
      env:
        PY: ${{ steps.setup.outputs.python }}
        FINDINGS: ${{ inputs.findings }}
        TOPOLOGY: ${{ inputs.topology }}
        OUT: ${{ inputs.output-dir }}
        FAIL_ON: ${{ inputs.fail-on }}
        STRICT: ${{ inputs.strict }}
      run: |
        mkdir -p "$OUT"
        args=(plan "$FINDINGS" "$TOPOLOGY" -o "$OUT/brace-action-plan.md" --csv "$OUT/brace-actions.csv"
              --json "$OUT/brace-action-plan.json" --sarif "$OUT/brace.sarif" --html "$OUT/brace-action-plan.html"
              --repo . --fail-on "$FAIL_ON" --github-output "$GITHUB_OUTPUT")
        [ "$STRICT" = "true" ] && args+=(--strict)
        TOKEN="$("$PY" -I -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::$TOKEN"
        set +e
        "$PY" -I "$GITHUB_ACTION_PATH/brace_run.py" "${args[@]}" 2> >(tee "$OUT/notes.txt" >&2)
        code=$?
        set -e
        echo "::$TOKEN::"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        if [ "$code" = 2 ]; then exit 2; fi

    - name: Compare the map with the record
      id: record
      shell: bash
      env:
        PY: ${{ steps.setup.outputs.python }}
        TOPOLOGY: ${{ inputs.topology }}
        RECORD: ${{ inputs.record }}
        DRIFT: ${{ inputs.record-drift }}
        OUT: ${{ inputs.output-dir }}
      run: |
        if [ -z "$RECORD" ] || [ "$DRIFT" = "off" ]; then echo "status=skipped" >> "$GITHUB_OUTPUT"; exit 0; fi
        set +e
        "$PY" -I "$GITHUB_ACTION_PATH/brace_run.py" map record "$TOPOLOGY" --record "$RECORD" > "$OUT/record.txt"
        code=$?
        set -e
        TOKEN="$("$PY" -I -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::$TOKEN"
        cat "$OUT/record.txt"
        echo "::$TOKEN::"
        if [ "$code" = 0 ]; then status=current
        elif grep -q "^No topology record" "$OUT/record.txt"; then status=missing
        else status=differs; fi
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" != current ]; then
          echo "::warning title=BRACE map::The map is $status compared with the record. A person should review it and update the record with brace map record --apply."
        fi

    - name: Job summary
      if: always()
      shell: bash
      env:
        OUT: ${{ inputs.output-dir }}
        RECORD_STATUS: ${{ steps.record.outputs.status }}
      run: |
        # The plan's Markdown escapes findings text (no links, images or HTML from the review).
        if [ -f "$OUT/brace-action-plan.md" ]; then
          { echo "> Map record: ${RECORD_STATUS:-not checked}. Full page: brace-action-plan.html in the brace-report artifact."
            echo
            cat "$OUT/brace-action-plan.md"; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the report
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: brace-report
        path: ${{ inputs.output-dir }}
        if-no-files-found: ignore

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && hashFiles(format('{0}/brace.sarif', inputs.output-dir)) != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        sarif_file: ${{ inputs.output-dir }}/brace.sarif
        category: brace

    - name: Apply the gate
      shell: bash
      env:
        CODE: ${{ steps.plan.outputs.exit_code }}
        RECORD_STATUS: ${{ steps.record.outputs.status }}
        DRIFT: ${{ inputs.record-drift }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        fail=0
        case "$CODE" in
          1) echo "::error title=BRACE::The plan has input notes (see notes.txt in the report). Fix them or set strict: false."; fail=1;;
          3) echo "::error title=BRACE::Actions match fail-on: $FAIL_ON. See the job summary."; fail=1;;
        esac
        if [ "$DRIFT" = fail ] && [ "$RECORD_STATUS" != current ] && [ "$RECORD_STATUS" != skipped ]; then
          echo "::error title=BRACE map::The map is $RECORD_STATUS compared with the record."; fail=1
        fi
        exit $fail
