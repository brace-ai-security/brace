# BRACE deployment record. Describe the exact setup you are signing off.
# Changes to this file should be reviewed by Governance and the Business owner
# (see CODEOWNERS.example).

brace_checklist: "2026-10-01"     # checklist revision you reviewed against

deployment:
  name: "TODO: agent name"
  environment: production
  release: "TODO: release or version"
  task: "TODO: what the agent does, in one or two sentences."
  allowed_actions: []             # e.g. ["read tickets", "draft replies"]
  tenants: "TODO: whose data it can reach, and what must stay separate."
  data_sensitivity: "TODO: what sensitive data it handles."
  worst_credible_damage: "TODO: the worst damage it could credibly cause."

# Stakes and autonomy rating. Required: release is blocked until it is filled in.
# Uncomment and complete:
# classification:
#   stakes: high                  # high | low
#   autonomy: low                 # high | low
#   rationale: "Why you chose this rating."
#   approved_by: "@someone"

# Agent-type-id: a fingerprint of the container, harness, prompt, model, and config.
# Edit manifest.yaml, run `python tools/brace/brace.py hash`, and paste the result.
# When the manifest is set, `check` recomputes the id and blocks if it changed.
# agent_type_id:
#   value: "sha256:..."
#   manifest: .brace/manifest.yaml

# Who holds each role (people as @login, teams as @org/team). Only governance is required.
roles:
  agent_team: []
  operations: []
  security: []
  infrastructure: []
  governance: ["TODO: @your-org/ai-governance"]
  business_owner: []
  data_privacy: []
  model_team: []
  vendors: []
  independent_audit: []

# Risk acceptances (exceptions/) and N/A decisions (na/) are approved by a
# pull request review. An approving review from one of these counts.
# The person who opened the pull request can't approve their own.
approvals:
  provider: github                # github | none
  approvers: ["@your-org/ai-governance"]
