# BRACE sign-off check. Copy to .github/workflows/brace-check.yml.
#
# It installs the BRACE tools from PyPI at an exact version, so the checker your
# release is judged by is the one your pull request names. For a stronger pin,
# list open-agent-security[record] with hashes in a requirements file and install
# it with pip --require-hashes. (A vendored tools/brace/ copy also still works:
# run python tools/brace/brace.py check instead of brace check.)
#
# Approvals: brace check reads pull request reviews to confirm that each risk
# acceptance (.brace/exceptions/) and N/A (.brace/na/) was approved by someone in
# approvals.approvers who did not open the pull request.
# If approvers include teams (@org/team), reading team membership needs a token
# with the read:org scope (or a fine-grained token with Members: read). The
# default GITHUB_TOKEN can't read team membership. Store such a token as the
# secret BRACE_GITHUB_TOKEN; without it the workflow falls back to GITHUB_TOKEN,
# which works only when every approver is listed as a user (@login).

name: BRACE check

on:
  pull_request:
  pull_request_review:        # re-run when someone approves, so a new exception can pass before merge
    types: [submitted, dismissed]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  brace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0      # full history: the check looks up the last commit that touched each file

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the BRACE tools
        run: pip install "open-agent-security[record]==3.3.0"

      - name: Check BRACE record
        env:
          GITHUB_TOKEN: ${{ secrets.BRACE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: brace check --approvals github --strict --json brace-result.json

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brace-result
          path: brace-result.json
          if-no-files-found: ignore
