# BRACE security map and action plan. Copy to .github/workflows/brace-action-plan.yml.
#
# It reads the review your team committed (brace-findings.json, made by the
# brace-review skill) and its map, then:
#   - writes a web page, Markdown, JSON, CSV and SARIF into the brace-report artifact;
#   - shows the plan, with the map, in the job summary;
#   - uploads SARIF so each action appears in code scanning;
#   - warns when the map no longer matches .brace/topology.cdx.json;
#   - fails the job when a Blocker gap is open (change fail-on to suit).
#
# The Action runs BRACE from its own checkout with `python -I`, so nothing in your
# repository can be imported; it installs hash-pinned PyYAML and jsonschema into a
# private virtual environment and pins every third-party action by commit SHA.
# Pin this Action to a release tag or, better, its commit SHA. It runs no model and
# needs no secrets.

name: BRACE action plan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # SARIF upload; remove with upload-sarif: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: brace-ai-security/open-agent-security/actions/plan@v3.3.0   # or pin a commit SHA
        with:
          findings: brace-findings.json
          topology: brace-topology.cdx.json
          build-topology: "true"          # rebuild from .mcp.json, config and the overlay
          agent-config: config/agent.yaml # remove if your agent has no such file
          fail-on: blocker
          record-drift: warn
