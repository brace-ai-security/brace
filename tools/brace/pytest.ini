[pytest]
# The whole default suite must finish in under 10 minutes (target: under 5) on a busy
# machine and in CI. Tests run in parallel (pytest-xdist), each is cut off after 60 s
# (pytest-timeout) so a hang fails fast, and stress runs too large for that budget are
# marked `slow` and run only on request (`-m slow`) and in the nightly CI job.
# Test-only dependencies: pytest, pytest-xdist, pytest-timeout, pyyaml, jsonschema.
addopts = -n auto --dist worksteal --timeout=60 -m "not slow" -p no:cacheprovider
markers =
    slow: a large stress input kept out of the default run; run with -m slow
