# Travel booking assistant. Fictional example for the BRACE topology report.
agent:
  name: travel-agent
  model: claude-sonnet-4-5
  operational_owner: team-travel-ops

tools:
  allowlist:
    - search_flights
    - book_flight
    - get_traveler_profile
    - send_itinerary
    - convert_currency
    - travel-docs__lookup_visa_rules
    - travel-docs__get_advisories

# What the agent is meant to reach. The report compares this with the code.
connections:
  - from: tool:search_flights
    to: api:fares
    kind: external_api
    name: fares and booking API
    label: searches fares
  - from: tool:book_flight
    to: api:fares
    label: books and pays for tickets
  - from: tool:get_traveler_profile
    to: data:profiles
    kind: data_store
    name: traveler profiles database
    label: reads passport and contact details
  - from: tool:send_itinerary
    to: api:email
    kind: external_api
    name: email delivery API
    label: sends itineraries
  - from: tool:convert_currency
    to: api:fx
    kind: external_api
    name: exchange-rate API
    label: gets exchange rates
  - from: mcp:travel-docs
    to: api:advisories
    kind: external_api
    name: government travel advisories
    label: fetches visa rules and advisories

# What each part can do, in the terms of BRACE B05 (read by tools/brace/topology.py).
capabilities:
  tool:get_traveler_profile: [private_data]
  tool:send_itinerary: [external_send]
  tool:book_flight: [destructive]

budgets:
  max_tool_calls: 40
  max_spend_usd: 3000
