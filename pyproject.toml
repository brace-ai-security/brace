[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-security"
dynamic = ["version"]
description = "Find known-dangerous AI agent setups: disabled permission checks, unpinned MCP servers, secrets in agent config, lethal capability combinations."
readme = "tools/brace/PYPI.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The BRACE Project" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "security", "mcp", "prompt-injection", "llm"]

[project.optional-dependencies]
# The scanner needs nothing beyond the standard library. The record checker, the map and the
# action plan (the `brace` command apart from `brace scan`) need PyYAML and jsonschema.
record = ["PyYAML>=6", "jsonschema>=4.18"]
all = ["PyYAML>=6", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://braceframework.org"

[project.scripts]
open-agent-security = "open_agent_security.cli:main"
brace = "brace_tools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_agent_security", "open_agent_security.*", "brace_tools", "brace_tools.*"]

[tool.setuptools.package-data]
open_agent_security = ["report/schema/*.json", "rule_examples.md"]
brace_tools = [
    "data/*.json",
    "data/schemas/*.json",
    "data/schemas/cyclonedx-1.7/*",
    "data/templates/.brace/*",
    "data/templates/.brace/*/.gitkeep",
]

[tool.setuptools.dynamic]
version = { attr = "open_agent_security.__version__" }

[tool.pytest.ini_options]
# One command from the repository root runs the whole default suite (see CLAUDE.md, Build & Test).
# It must finish in under 10 minutes (target: under 5) on a busy machine and in CI. Tests run in
# parallel (pytest-xdist), each is cut off after 60 s (pytest-timeout) so a hang fails fast, and
# stress runs too large for that budget are marked `slow` and run only on request (`-m slow`) and
# in the nightly CI job. Test-only dependencies: pytest, pytest-xdist, pytest-timeout, pyyaml,
# jsonschema. The packages are imported from src/ (pythonpath), never from an installed copy.
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/scan"]
addopts = "-n auto --dist worksteal --timeout=60 -m 'not slow' -p no:cacheprovider"
markers = ["slow: a large stress input kept out of the default run; run with -m slow"]
