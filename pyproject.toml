[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-agent-security"
dynamic = ["version"]
description = "Find known-dangerous AI agent setups: disabled permission checks, unpinned MCP servers, secrets in agent config, lethal capability combinations."
readme = "tools/brace/SCAN.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The BRACE Project" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai-agents", "security", "mcp", "prompt-injection", "llm"]

[project.urls]
Homepage = "https://braceframework.org"

[project.scripts]
open-agent-security = "open_agent_security.cli:main"

[tool.setuptools]
package-dir = { "" = "tools/brace" }

[tool.setuptools.packages.find]
where = ["tools/brace"]
include = ["open_agent_security", "open_agent_security.*"]

[tool.setuptools.package-data]
open_agent_security = ["report/schema/*.json"]

[tool.setuptools.dynamic]
version = { attr = "open_agent_security.__version__" }
