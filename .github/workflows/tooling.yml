name: BRACE tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest
      - name: Item data matches the checklist and role map
        run: python tools/brace/gen_items.py --check
      - name: Skill references match the checklist, recipes, roles, and heuristics
        run: python skills/gen_references.py --check
      - name: brace.py tests
        run: python -m pytest tools/brace/tests -q
      - name: brace-review script tests
        run: python -m pytest skills/brace-review/scripts -q
