name: BRACE tooling

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml jsonschema pytest
      - name: open-agent-security scan finds no dangerous agent setups in this repository
        run: python -I tools/brace/scan.py . --fail-on low
      - name: Item data matches the checklist and role map
        run: python tools/brace/gen_items.py --check
      - name: Skill references match the checklist, recipes, roles, and heuristics
        run: python skills/gen_references.py --check
      - name: Checklist web page matches CHECKLIST.md
        run: python tools/site/gen_checklist_page.py --check
      - name: Verification and self-assessment pages match their sources
        run: python tools/site/gen_doc_pages.py --check
      - name: Install CycloneDX CLI (pinned)
        env:
          CDX_VERSION: v0.33.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/cyclonedx" \
            "https://github.com/CycloneDX/cyclonedx-cli/releases/download/${CDX_VERSION}/cyclonedx-linux-x64"
          chmod +x "$RUNNER_TEMP/cyclonedx"
          echo "CYCLONEDX_CLI=$RUNNER_TEMP/cyclonedx" >> "$GITHUB_ENV"
      - name: Example topologies validate in the CycloneDX CLI
        run: |
          for f in tools/brace/examples/*/topology.cdx.json; do
            "$CYCLONEDX_CLI" validate --input-file "$f" --input-format json --input-version v1_7 --fail-on-errors
          done
      - name: brace.py tests
        run: python -m pytest tools/brace/tests -q
      - name: brace-review script tests
        run: python -m pytest skills/brace-review/scripts evals/test_repeat.py -q
      - name: Dedicated MCP qualification harness tests
        run: python -m unittest discover -s evals/mcp -p 'test_*.py'
