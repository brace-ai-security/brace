# Codex admin-enforced requirements: values users and project config cannot go beyond.
# Deploy as /etc/codex/requirements.toml (Linux and macOS), or through your MDM's managed
# preferences. Codex refuses a config, profile or command-line flag that asks for a value
# outside these lists.
#
# Follows: https://developers.openai.com/codex/security  (admin-enforced requirements)
# As of: 2026-11-27. Check the page before deploying; setting names change between releases.

# Approval policies a user may choose. "never" (no approvals) is left out, so an agent cannot be
# configured to run every command unasked. BRACE B05; anti-patterns AP01, AP02.
allowed_approval_policies = ["untrusted", "on-request"]

# Sandbox modes a user may choose. "danger-full-access" is left out, so the sandbox stays on.
# BRACE B08, B05; anti-patterns AP01, AP02.
allowed_sandbox_modes = ["read-only", "workspace-write"]
