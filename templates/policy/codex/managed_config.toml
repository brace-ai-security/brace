# Codex managed defaults: the starting configuration on every managed machine. Users may change
# these within the limits of requirements.toml (deploy both).
# Deploy as /etc/codex/managed_config.toml (Linux and macOS), or through your MDM's managed
# preferences.
#
# Follows: https://developers.openai.com/codex/security  (managed configuration)
#          https://developers.openai.com/codex/config-reference  (setting names)
# As of: 2026-11-27. Check the pages before deploying; setting names change between releases.

# Ask before running commands the model wants to run outside the safe set. BRACE B05; AP01.
approval_policy = "on-request"

# Writes only inside the workspace; the rest of the disk is read-only. BRACE B08; AP01, AP08.
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
# No network from sandboxed commands, so an injected command cannot send data out. BRACE B09; AP09.
network_access = false

[shell_environment_policy]
# Commands see only core variables (PATH, HOME and the like), not tokens from the user's
# environment. BRACE B03; AP05.
inherit = "core"
